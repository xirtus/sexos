TIMEOUT=3
SERIAL=yes

:SexOS
    PROTOCOL=limine
    KERNEL_PATH=boot:///sexos-kernel
    MODULE_PATH=boot:///servers/sexdisplay
    MODULE_PATH=boot:///servers/silk-shell
    MODULE_PATH=boot:///apps/sexdrive
    MODULE_PATH=boot:///servers/sexinput
    MODULE_PATH=boot:///servers/sexusb
    MODULE_PATH=boot:///servers/silkbar
    MODULE_PATH=boot:///servers/linen
    MODULE_PATH=boot:///servers/sexstore
    MODULE_PATH=boot:///servers/quil
    MODULE_PATH=boot:///servers/sexbell
    MODULE_PATH=boot:///servers/sexfiles
    MODULE_PATH=boot:///apps/spindle
    MODULE_PATH=boot:///servers/sexnet
    MODULE_PATH=boot:///servers/sext
    MODULE_PATH=boot:///apps/kaleidoscope
    MODULE_PATH=boot:///apps/hello
    MODULE_PATH=boot:///apps/purple-scanout
    MODULE_PATH=boot:///firmware/wifi.pack
    MODULE_PATH=boot:///boot.img
    # No RESOLUTION: Limine sets the monitor's own preferred (native) mode from its EDID.

# Same sealed kernel and modules; explicit compact display acceptance entry.
:SexOS compact 1024x768
    PROTOCOL=limine
    KERNEL_PATH=boot:///sexos-kernel
    MODULE_PATH=boot:///servers/sexdisplay
    MODULE_PATH=boot:///servers/silk-shell
    MODULE_PATH=boot:///apps/sexdrive
    MODULE_PATH=boot:///servers/sexinput
    MODULE_PATH=boot:///servers/sexusb
    MODULE_PATH=boot:///servers/silkbar
    MODULE_PATH=boot:///servers/linen
    MODULE_PATH=boot:///servers/sexstore
    MODULE_PATH=boot:///servers/quil
    MODULE_PATH=boot:///servers/sexbell
    MODULE_PATH=boot:///servers/sexfiles
    MODULE_PATH=boot:///apps/spindle
    MODULE_PATH=boot:///servers/sexnet
    MODULE_PATH=boot:///servers/sext
    MODULE_PATH=boot:///apps/kaleidoscope
    MODULE_PATH=boot:///apps/hello
    MODULE_PATH=boot:///apps/purple-scanout
    MODULE_PATH=boot:///firmware/wifi.pack
    MODULE_PATH=boot:///boot.img
    RESOLUTION=1024x768x32

# Same system with DMA protection (VT-d / AMD-Vi) off, for a machine whose
# firmware tables or IOMMU misbehave. Drivers then copy through their pools.
:SexOS without DMA protection
    PROTOCOL=limine
    KERNEL_PATH=boot:///sexos-kernel
    CMDLINE=iommu=off
    MODULE_PATH=boot:///servers/sexdisplay
    MODULE_PATH=boot:///servers/silk-shell
    MODULE_PATH=boot:///apps/sexdrive
    MODULE_PATH=boot:///servers/sexinput
    MODULE_PATH=boot:///servers/sexusb
    MODULE_PATH=boot:///servers/silkbar
    MODULE_PATH=boot:///servers/linen
    MODULE_PATH=boot:///servers/sexstore
    MODULE_PATH=boot:///servers/quil
    MODULE_PATH=boot:///servers/sexbell
    MODULE_PATH=boot:///servers/sexfiles
    MODULE_PATH=boot:///apps/spindle
    MODULE_PATH=boot:///servers/sexnet
    MODULE_PATH=boot:///servers/sext
    MODULE_PATH=boot:///apps/kaleidoscope
    MODULE_PATH=boot:///apps/hello
    MODULE_PATH=boot:///apps/purple-scanout
    MODULE_PATH=boot:///firmware/wifi.pack
    MODULE_PATH=boot:///boot.img
    # No RESOLUTION: the native mode, like the main entry.

# Same sealed kernel and modules at the old fixed mode, for monitors whose EDID misleads.
:SexOS 1280x800 (if the native mode fails)
    PROTOCOL=limine
    KERNEL_PATH=boot:///sexos-kernel
    MODULE_PATH=boot:///servers/sexdisplay
    MODULE_PATH=boot:///servers/silk-shell
    MODULE_PATH=boot:///apps/sexdrive
    MODULE_PATH=boot:///servers/sexinput
    MODULE_PATH=boot:///servers/sexusb
    MODULE_PATH=boot:///servers/silkbar
    MODULE_PATH=boot:///servers/linen
    MODULE_PATH=boot:///servers/sexstore
    MODULE_PATH=boot:///servers/quil
    MODULE_PATH=boot:///servers/sexbell
    MODULE_PATH=boot:///servers/sexfiles
    MODULE_PATH=boot:///apps/spindle
    MODULE_PATH=boot:///servers/sexnet
    MODULE_PATH=boot:///servers/sext
    MODULE_PATH=boot:///apps/kaleidoscope
    MODULE_PATH=boot:///apps/hello
    MODULE_PATH=boot:///apps/purple-scanout
    MODULE_PATH=boot:///firmware/wifi.pack
    MODULE_PATH=boot:///boot.img
    RESOLUTION=1280x800x32

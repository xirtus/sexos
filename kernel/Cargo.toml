[package]
name = "sex-kernel"
version = "0.1.0"
edition = "2021"

[features]
# Gates the AArch64 Phase-2 image bin (sex-kernel-arm64). x86 default
# builds do NOT enable it, so the x86 target set is unchanged.
arm64 = []
# Phase 6: fail-closed halt if S1POE absent (default off: dev banner +
# continue with isolation=none). x86 builds never enable it.
arm64-require-poe = []

# ── x86_64 reference binary (src/main.rs, auto-discovered) ─────────────────
# ── AArch64 Phase-2 image (entry + PL011 serial only) ──────────────────────
[[bin]]
name = "sex-kernel-arm64"
path = "src/arch/aarch64/main.rs"
required-features = ["arm64"]

# ── x86_64-only dependencies ───────────────────────────────────────────────
# All current deps serve the x86_64 modules. The AArch64 Phase-2 build
# (arch/aarch64 only) needs ZERO external crates; target-specific scoping
# keeps x86 resolution identical while letting aarch64 compile without
# x86-only crates (x86_64, raw-cpuid, x86, x2apic, uart_16550 contain
# x86 assembly/intrinsics that cannot build for AArch64).
[target.'cfg(target_arch = "x86_64")'.dependencies]
limine = "0.6.3"
x86_64 = { version = "0.15.2", default-features = false, features = ["instructions", "abi_x86_interrupt", "nightly"] }
uart_16550 = { version = "0.3.0", default-features = false }
spinning_top = { version = "0.3.0", default-features = false }
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
conquer-once = { version = "0.4.0", default-features = false }
linked_list_allocator = { version = "0.10.5", default-features = false, features = ["use_spin"] }
crossbeam-queue = { version = "0.3.8", default-features = false, features = ["alloc"] }
acpi = { version = "6.1.1", default-features = false, features = ["alloc", "aml"] }
aml = { version = "0.16.4", default-features = false }
pci_types = "0.10"
x2apic = "0.5"
# Explicitly disable default features for transitive deps (prevents build noise)
bitflags = { version = "2.4.0", default-features = false }
radium = { version = "0.7.0", default-features = false }
bit_field = { version = "0.10.3", default-features = false }
volatile = { version = "0.4.6", default-features = false }
scopeguard = { version = "1.2.0", default-features = false }
tap = { version = "1.0.1", default-features = false }
spin = { version = "0.9.8", default-features = false, features = ["mutex", "spin_mutex"] }
raw-cpuid = { version = "11.2.0", default-features = false }
x86 = "0.52.0"

# Use rand_hc v0.5.0 for no_std random number generation on x86_64 targets,
# which implicitly uses rdrand. Exclude 'std' feature.
rand_hc = { version = "0.5.0", default-features = false }
sex-pdx = { path = "../crates/sex-pdx" }

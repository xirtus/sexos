[package]
name = "spreadeagle"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "spreadeagle"
path = "src/main.rs"

[dependencies]
# GridCraft's engine (storytold/gridcraft, MIT OR Apache-2.0): formulas, number formats,
# sheets, xlsx/xls/csv import and export, charts. Its egui UI comes when egui runs on sex-app.
gridcraft-engine = { git = "https://github.com/storytold/gridcraft", rev = "c0ee120ac2d9b59630f5abf1151dd9b471fe2926" }
# Its charts: data resolution, layout and a small rasteriser (the grid draws the text).
gridcraft-chart = { git = "https://github.com/storytold/gridcraft", rev = "c0ee120ac2d9b59630f5abf1151dd9b471fe2926" }
serde_json = "1"
# ODS formulas (GridCraft imports ODS values only): the same zip and XML readers GridCraft uses.
zip = { version = "3", default-features = false, features = ["deflate"] }
quick-xml = "0.41"

[target.'cfg(target_os = "hermit")'.dependencies]
sex-std = { path = "../../crates/sex-std" }
sex-office = { path = "../../crates/sex-office" }

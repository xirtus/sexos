[package]
name = "tassel"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[[bin]]
name = "tassel"
path = "src/main.rs"

[dependencies]
sex-egui = { path = "../../crates/sex-egui" }
egui = { version = "0.37.0", default-features = false, features = ["default_fonts"] }
egui_demo_lib = { version = "0.37.0", default-features = false }
# The demo's pictures: its logo is SVG (resvg, MIT/Apache-2.0), its icons PNG (image, MIT/Apache-2.0).
egui_extras = { version = "0.37.0", default-features = false, features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }

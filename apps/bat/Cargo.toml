[package]
name = "bat-app"
version = "0.26.1"
edition = "2021"
# bat's own licence (vendor/bat-0.26.1/LICENSE-MIT, LICENSE-APACHE); the SexOS lines in it are tagged.
license = "MIT OR Apache-2.0"
description = "bat 0.26.1 (vendor/bat-0.26.1) as a SexOS program"

# The package is bat-app so that it is not confused with the bat library it uses.
# bat's binary source, unchanged but for lines marked `SexOS:`.
[[bin]]
name = "bat"
path = "../../vendor/bat-0.26.1/src/bin/bat/main.rs"

# The published bat library, with the pure-Rust regex engine (fancy-regex) instead of
# Oniguruma (C), and without git (libgit2, C), paging (a pager is another program)
# and lessopen (starts other programs). Plus what bat's binary uses directly
# (bat 0.26.1's `minimal-application` without `paging` and `regex-onig`).
[dependencies]
sex-std = { path = "../../crates/sex-std" }
bat = { version = "=0.26.1", default-features = false, features = ["regex-fancy"] }
clap = { version = "4.5.46", features = ["wrap_help", "cargo"] }
console = "0.16.0"
etcetera = "0.11.0"
globset = "0.4"
nu-ansi-term = "0.50.0"
once_cell = "1.20"
shell-words = "1.1.0"
wild = "2.2"

# bat's optional features are off; code only they use is left out, and what only the
# pager used (OutputType, the terminal title) stays unused.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("application", "bugreport", "build-assets", "git", "lessopen", "paging"))'] }
unused_imports = "allow"
dead_code = "allow"

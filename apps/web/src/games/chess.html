  }
  // Board edge letters and the cursor.
  g.fillStyle = '#a89f91'; g.font = '9px sans-serif'; g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  const [cx, cy] = screenOf(cur);
  g.strokeStyle = '#ffffff'; g.lineWidth = 3; g.strokeRect(cx + 1.5, cy + 1.5, S - 3, S - 3);
  g.strokeStyle = '#1565c0'; g.lineWidth = 1; g.strokeRect(cx + 3.5, cy + 3.5, S - 7, S - 7);
  // Side panel.
  let y = 20;
  const line = (text, color, size, bold) => { g.fillStyle = color; g.font = (bold ? 'bold ' : '') + size + 'px sans-serif'; g.fillText(text, PX, y); y += size + 5; };
  line('Chess', '#f0d9b5', 16, true);
  line('Computer: ' + LEVELS[level][0], '#a89f91', 11);
  y += 2;
  if (over) {
    for (const part of over.split('. ')) line(part.endsWith('!') || part.endsWith('.') ? part : part + '.', '#ffd54f', 12, true);
  } else if (busy) line('Thinking…', '#ffd54f', 12, true);
  else line(check ? 'Check! Your move' : 'Your move', check ? '#ff8a80' : '#ffffff', 12, true);
  line(sqName(cur) + (note ? '  ' + note : ''), '#a89f91', 10);
  y += 2;
  const start = Math.max(0, history.length - 10 + (history.length % 2));
  for (let i = start; i < history.length; i += 2) {
    const n = (i >> 1) + 1;
    line(n + '. ' + history[i].text + (history[i + 1] ? '  ' + history[i + 1].text : ''), '#e8e2d6', 10);
  }
  y = H - 30;
  line('Enter move  Esc drop', '#857c70', 9);
  line('U undo  N new  L level', '#857c70', 9);
}

function select() {
  if (over || busy) return;
  const p = pos.b[cur];
  if (picked >= 0) {
    const options = legal().filter(m => (m & 63) === picked && (m >> 6 & 63) === cur);
    if (options.length) {
      // A pawn reaching the end becomes a queen.
      const m = options.find(m => (m >> 12 & 15) === 0 || (m >> 12 & 15) === Q);
      picked = -1; note = '';
      play(m);
      if (!over) { busy = true; setTimeout(computer, 20); }
      return;
    }
  }
  if (p > 0 && legal().some(m => (m & 63) === cur)) { picked = picked === cur ? -1 : cur; note = ''; }
  else if (p > 0) { picked = -1; note = 'cannot move'; }
  else picked = -1;
}
function key(k) {
  const up = flip ? 8 : -8;
  switch (k) {
    case 'ArrowUp': if (cur + up >= 0 && cur + up < 64) cur += up; break;
    case 'ArrowDown': if (cur - up >= 0 && cur - up < 64) cur -= up; break;
    case 'ArrowLeft': if (fileOf(cur) !== (flip ? 7 : 0)) cur += flip ? 1 : -1; break;
    case 'ArrowRight': if (fileOf(cur) !== (flip ? 0 : 7)) cur += flip ? -1 : 1; break;
    case 'Enter': case ' ': select(); break;
    case 'Escape': picked = -1; break;
    case 'u': case 'U': case 'Backspace':
      if (busy) break;
      picked = -1; over = '';
      // Take back the computer's reply and your move.
      for (let i = pos.side < 0 ? 1 : 2; i > 0 && history.length; i--) { history.pop(); unmake(); }
      lastMove = history.length ? history[history.length - 1].m : 0;
      note = 'took back';
      break;
    case 'n': case 'N': if (!busy) newGame(); break;
    case 'l': case 'L': level = (level + 1) % LEVELS.length; break;
    default: return false;
  }
  draw();
  return true;
}
document.addEventListener('keydown', e => { if (key(e.key)) e.preventDefault(); });
newGame();
draw();
</script>

[package]
name = "web"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "web"
path = "src/main.rs"

# The browser again, opening its built-in game (see `first_page`).
[[bin]]
name = "solitaire"
path = "src/main.rs"

[[bin]]
name = "chess"
path = "src/main.rs"

[[bin]]
name = "maze"
path = "src/main.rs"

[[bin]]
name = "chess3d"
path = "src/main.rs"

[[bin]]
name = "pinball"
path = "src/main.rs"

[dependencies]
sex-pdx = { path = "../../crates/sex-pdx" }
sex-app = { path = "../../crates/sex-app" }
sex-web = { path = "../../crates/sex-web" }
sex-js = { path = "../../crates/sex-js" }
sex-media = { path = "../../crates/sex-media" }
sex-webaudio = { path = "../../crates/sex-webaudio" }
sex-uvc = { path = "../../crates/sex-uvc" }
sex-image = { path = "../../crates/sex-image" }
sex-gl = { path = "../../crates/sex-gl" }
sex-fetch = { path = "../../crates/sex-fetch" }
sex-shields = { path = "../../crates/sex-shields" }
sex-extensions = { path = "../../crates/sex-extensions" }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }

[features]
jit-profile = ["baseline-jit", "sex-js/jit-profile"]
baseline-jit = ["sex-js/baseline-jit"]

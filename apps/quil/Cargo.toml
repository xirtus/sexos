[package]
name = "quil-app"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Quil, the SexOS code editor: files of any size, tabs, many cursors, Vim and Emacs keys, a command palette, Go to File and project search"

[[bin]]
name = "quil"
path = "src/main.rs"

[dependencies]
sex-pdx = { path = "../../crates/sex-pdx" }
sex-app = { path = "../../crates/sex-app" }
sex-font = { path = "../../crates/sex-font" }
quil-core = { path = "../../crates/quil-core" }

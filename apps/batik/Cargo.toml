[package]
name = "batik"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Batik: Weft image editor and digital painting app"

[[bin]]
name = "batik"
path = "src/main.rs"

[features]
default = ["sexos"]
sexos = ["dep:sex-pdx", "dep:sex-app"]

[dependencies]
batik-core = { path = "../../crates/batik-core" }
sex-image = { path = "../../crates/sex-image" }
sex-font = { path = "../../crates/sex-font" }
sex-canvas = { path = "../../crates/sex-canvas" }
libm = "0.2"
sex-pdx = { path = "../../crates/sex-pdx", optional = true }
sex-app = { path = "../../crates/sex-app", optional = true }

[package]
name = "abacus"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Abacus: the SexOS calculator, the first program on the Weft toolkit."

[[bin]]
name = "abacus"
path = "src/main.rs"

[features]
default = ["sexos"]
sexos = ["dep:sex-pdx", "dep:sex-app", "weft/sexos"]

[dependencies]
weft = { path = "../../crates/weft" }
libm = "0.2"
sex-pdx = { path = "../../crates/sex-pdx", optional = true }
sex-app = { path = "../../crates/sex-app", optional = true }

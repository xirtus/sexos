[package]
name = "pdf"
version = "0.1.0"
edition = "2021"
license.workspace = true

[[bin]]
name = "pdf"
path = "src/main.rs"

[dependencies]
sex-std = { path = "../../crates/sex-std" }
# PDF parsing and rendering in pure Rust (Apache-2.0 OR MIT).
hayro = "0.9.0"
# The find bar's and the outline's text, in the system's own monospaced font.
sex-font = { path = "../../crates/sex-font" }
# Annotations, form filling and incremental saves: Vellum's editing engine.
vellum-edit = { path = "../../crates/vellum-edit" }
# --thumb's shrinking, shared with Gaze.
sex-image = { path = "../../crates/sex-image" }

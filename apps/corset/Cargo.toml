[package]
name = "corset"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Corset: disks and partitions (GPT, FAT32, exFAT, sexfs, encryption) on removable disks the person hands it"

[[bin]]
name = "corset"
path = "src/main.rs"

[dependencies]
sex-pdx = { path = "../../crates/sex-pdx" }
sex-app = { path = "../../crates/sex-app" }
corset-core = { path = "../../crates/corset-core" }
sex-crypt = { path = "../../crates/sex-crypt" }
# RustCrypto, MIT/Apache-2.0: mixes the CPU's random numbers, as Files does for SSH keys.
sha2 = { version = "=0.10.9", default-features = false, features = ["force-soft"] }

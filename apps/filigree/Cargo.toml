[package]
name = "filigree"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Filigree: the SexOS font manager, specimen comparator, and Spindle typography bridge on Weft"

[[bin]]
name = "filigree"
path = "src/main.rs"

[features]
default = ["sexos"]
sexos = ["dep:sex-pdx", "dep:sex-app", "weft/sexos"]

[dependencies]
weft = { path = "../../crates/weft" }
filigree-core = { path = "../../crates/filigree-core" }
sex-font = { path = "../../crates/sex-font" }
libm = "0.2"
sex-pdx = { path = "../../crates/sex-pdx", optional = true }
sex-app = { path = "../../crates/sex-app", optional = true }

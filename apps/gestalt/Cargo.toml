[package]
name = "gestalt"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "gestalt"
path = "src/main.rs"

[dependencies]
# VectorCraft's engine (storytold/vectorcraft, MIT OR Apache-2.0): the document, paths and
# Pathfinder, SVG/PDF/.vectorcraft files, type, and the tools (pointer gestures reduce to
# commands). Its egui UI comes when egui runs on sex-app; Gestalt draws its own canvas.
vectorcraft-engine = { git = "https://github.com/storytold/vectorcraft", rev = "0995c130d1f5b5c8b57d22b80e1b2fc55b0b2248", default-features = false, features = ["bundled-fonts"] }
vectorcraft-render = { git = "https://github.com/storytold/vectorcraft", rev = "0995c130d1f5b5c8b57d22b80e1b2fc55b0b2248" }
vectorcraft-geom = { git = "https://github.com/storytold/vectorcraft", rev = "0995c130d1f5b5c8b57d22b80e1b2fc55b0b2248" }
vectorcraft-tools = { git = "https://github.com/storytold/vectorcraft", rev = "0995c130d1f5b5c8b57d22b80e1b2fc55b0b2248" }
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_os = "hermit")'.dependencies]
sex-std = { path = "../../crates/sex-std" }
sex-office = { path = "../../crates/sex-office" }

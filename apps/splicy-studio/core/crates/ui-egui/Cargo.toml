[package]
name = "filmcraft-ui-egui"
description = "The Splicy egui frontend (swappable): panels, docking, timeline, monitors, control channel"
version = "0.20.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[dependencies]
craft-ui = {version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "47107f660191de2f0b425569506f4daa4faadac9", features = ["serde", "native-windows"]}
filmcraft-time = {path = "../time"}
filmcraft-geom = {path = "../geom"}
filmcraft-color = {path = "../color"}
filmcraft-frame = {path = "../frame"}
filmcraft-media = {path = "../media"}
filmcraft-project = {path = "../project"}
filmcraft-tts = {path = "../tts"}
filmcraft-edit = {path = "../edit"}
filmcraft-render = {path = "../render"}
filmcraft-text = {path = "../text"}
filmcraft-captions = {path = "../captions"}
filmcraft-audio-dsp = {path = "../audio-dsp"}
filmcraft-engine = {path = "../engine"}
filmcraft-export = {path = "../export"}
filmcraft-gpu = {path = "../../../shims/filmcraft-gpu"}
filmcraft-scopes = {path = "../scopes"}
egui = {version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"]}
egui_extras = {version = "0.37", default-features = false}
eframe = {version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "wgpu"]}
serde = {version = "1", features = ["derive", "rc"]}
serde_json = {version = "1"}
log = {version = "0.4"}
rayon = {version = "1"}
web-time = "1"
# Unicode Bidirectional Algorithm for Arabic and Hebrew captions in reading order (MIT OR Apache-2.0).
unicode-bidi = "0.3.18"
# PNG for clipboard images.
image = { version = "0.25", default-features = false, features = ["png"] }

# Thread/process CPU clocks for frame-job profiling (safe wrappers; see frames.rs).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }
# the same clocks on Windows (GetThreadTimes / GetProcessTimes behind a safe API; MIT OR Apache-2.0)
[target.'cfg(windows)'.dependencies]
cpu-time = "1"

[build-dependencies]
serde_json = {version = "1"}
toml = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-update = {git = "https://github.com/storytold/craft-libs", version = "=0.1.0", rev = "47107f660191de2f0b425569506f4daa4faadac9", features = ["egui"]}

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
needless_range_loop = "allow"
type_complexity = "allow"

[package]
name = "filmcraft-format"
description = "Splicy .fcproj files: schema versions + migrations, atomic saves, auto-save naming and rotation"
version = "0.20.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[dependencies]
filmcraft-project = {path = "../project"}
filmcraft-media = {path = "../media"}
log = {version = "0.4"}
serde = {version = "1", features = ["derive", "rc"]}
serde_json = {version = "1"}
thiserror = {version = "2"}
chrono = {version = "0.4.45", default-features = false, features = ["std"]}

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
needless_range_loop = "allow"
type_complexity = "allow"

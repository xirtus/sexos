[package]
name = "filmcraft-export"
description = "Export pipeline: parallel render → encode → mux, presets, progress/cancel"
version = "0.20.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[dependencies]
craft-audio = {version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "156b491b91f3693f4fce53bf69bb97791f51198f", default-features = false, features = ["aac-decode", "aac-encode", "rayon", "ac3-decode", "mpa-decode", "mp3-decode", "decode-native", "symphonia", "opus-decode", "flac-encode", "mp3-encode"]}
craft-video = {version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "156b491b91f3693f4fce53bf69bb97791f51198f", features = ["h264-decode", "h264-encode", "hevc-decode", "vp9-decode", "av1-decode", "vp8-decode", "mpeg2", "apv", "prores", "threads"]}
filmcraft-time = {path = "../time"}
filmcraft-frame = {path = "../frame"}
filmcraft-color = {path = "../color"}
filmcraft-media = {path = "../media"}
craft-media = {version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "156b491b91f3693f4fce53bf69bb97791f51198f", default-features = false, features = ["mxf"]}
filmcraft-codecs = {path = "../codecs"}
filmcraft-project = {path = "../project"}
filmcraft-render = {path = "../render"}
filmcraft-audio-dsp = {path = "../audio-dsp"}
filmcraft-geom = {path = "../geom"}
filmcraft-text = {path = "../text"}
filmcraft-isobmff = {path = "../isobmff"}
filmcraft-dnx = {path = "../dnx"}
serde = {version = "1", features = ["derive", "rc"]}
serde_json = {version = "1"}
thiserror = {version = "2"}
rayon = {version = "1"}
log = {version = "0.4"}
web-time = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "bmp"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
needless_range_loop = "allow"
type_complexity = "allow"

[package]
name = "filmcraft-project"
description = "Splicy document model: projects, bins, clips, sequences, tracks, effects, keyframes, markers"
version = "0.20.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[dependencies]
filmcraft-time = {path = "../time"}
filmcraft-geom = {path = "../geom"}
filmcraft-color = {path = "../color"}
filmcraft-media = {path = "../media"}
serde = {version = "1", features = ["derive", "rc"]}
serde_json = {version = "1"}
url = {version = "2.5.8"}
thiserror = {version = "2"}

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
needless_range_loop = "allow"
type_complexity = "allow"

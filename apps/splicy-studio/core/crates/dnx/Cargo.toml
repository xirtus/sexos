[package]
name = "filmcraft-dnx"
description = "Clean-room Avid DNxHD / DNxHR (SMPTE ST 2019-1 VC-3) decoder and encoder"
version = "0.20.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[features]
default = ["threads"]
threads = ["dep:rayon"]

[dependencies]
filmcraft-bitstream = {path = "../bitstream"}
thiserror = {version = "2"}
rayon = {version = "1", optional = true}

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
needless_range_loop = "allow"
type_complexity = "allow"

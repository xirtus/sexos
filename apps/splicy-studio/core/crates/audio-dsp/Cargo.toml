[package]
name = "filmcraft-audio-dsp"
description = "Real-time audio DSP for Splicy: BS.1770 / EBU R128 loudness metering and audio effects"
version = "0.20.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[dependencies]

[features]
# `remix::test_music`, generated rhythmic music for the remix tests of dependent crates.
test-util = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
needless_range_loop = "allow"
type_complexity = "allow"

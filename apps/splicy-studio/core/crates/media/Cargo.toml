[package]
name = "filmcraft-media"
description = "Media sources: probing, decoding traits, frame cache, generators, stills"
version = "0.20.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[dependencies]
filmcraft-time = {path = "../time"}
filmcraft-color = {path = "../color"}
filmcraft-frame = {path = "../frame"}
filmcraft-dng = {path = "../dng"}
rayon = {version = "1"}
serde = {version = "1", features = ["derive", "rc"]}
thiserror = {version = "2"}
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
needless_range_loop = "allow"
type_complexity = "allow"

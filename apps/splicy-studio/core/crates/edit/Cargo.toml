[package]
name = "filmcraft-edit"
description = "Pure timeline edit algebra: insert, overwrite, razor, ripple, roll, slip, slide, rate stretch, lift, extract"
version = "0.20.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[dependencies]
filmcraft-time = {path = "../time"}
filmcraft-project = {path = "../project"}
thiserror = {version = "2"}

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
needless_range_loop = "allow"
type_complexity = "allow"

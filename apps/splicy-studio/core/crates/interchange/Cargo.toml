[package]
name = "filmcraft-interchange"
description = "Splicy interchange: CMX 3600 EDL, Final Cut Pro 7 XML (xmeml), FCPXML and OpenTimelineIO import/export"
version = "0.20.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[dependencies]
filmcraft-time = {path = "../time"}
filmcraft-geom = {path = "../geom"}
filmcraft-color = {path = "../color"}
filmcraft-media = {path = "../media"}
filmcraft-project = {path = "../project"}
filmcraft-cfb = {path = "../cfb"}
craft-timeline = {version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "47107f660191de2f0b425569506f4daa4faadac9", features = ["serde"]}
serde = {version = "1", features = ["derive", "rc"]}
serde_json = {version = "1"}
thiserror = {version = "2"}
roxmltree = {version = "0.21"}

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
needless_range_loop = "allow"
type_complexity = "allow"

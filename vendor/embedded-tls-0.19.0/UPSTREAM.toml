original_members = 96
scope = "Reject empty/all-padding TLSInnerPlaintext and unsupported post-handshake records without panic. Require exact offered suite, TLS1.3/P256 ServerHello selections and message/extents; reject unsupported retries and duplicate/unoffered extensions. No new TLS features, providers, protocols or authority."
manifest_normalization = "Retain Cargo.toml.upstream exactly. Remove only upstream host integration [[test]] entries and [dev-dependencies.*] from effective Cargo.toml. All normal/optional dependency and feature declarations remain identical."
test_normalization = "Remove logging-only env_logger::init from upstream key_share unit setup; add a test-only harness of the identical actual vendor library source and existing enabled crypto dependency set, with scalar SHA2."
patch = "SEXOS_PATCHES.patch"


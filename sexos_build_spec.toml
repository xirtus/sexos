# ── SilkBar Integration Status ──────────────────────────────────────────────────
#
# silkbar  → producer stub (v7). Owns SilkBarUpdateQueue, no PDX transport yet.
#            v8+ will connect to sexdisplay via PDX for live updates.
# sexdisplay → local model consumer. Owns mutable SilkBar + queue, drains each frame.
#            Remains sole renderer until v8. No kernel behavior change.
# ────────────────────────────────────────────────────────────────────────────────

[spec]
version = "1.0.0"
abi_version_hash = "53e0407055be8d29469e7fdd384235f09e1ece5556351fb2c6f02a26eff7e437"
contract_sha256 = "093f260760273d6f40a0bab6330ea7f9d95f744a4d8a7464fb92241e10740df4"
target = "x86_64-sex.json"

[forbidden_env]
vars = [
  "SEXOS_BUILD_MODE",
  "SEXOS_BUILD_PROFILE",
  "SEXOS_DISABLE_ABI_GUARD",
  "SEXOS_SKIP_CONTRACT",
  "CARGO_FEATURES",
  "CARGO_BUILD_TARGET",
  "RUSTC_BOOTSTRAP"
]
prefixes = ["CARGO_FEATURE_"]

[allowed]
crates = [
  "sex-kernel",
  "servers/sexbell/Cargo.toml",
  "servers/sexacpi/Cargo.toml",
  "servers/sexdisplay/Cargo.toml",
  "apps/sexdrive/Cargo.toml",
  "servers/silk-shell/Cargo.toml",
  "servers/sexinput/Cargo.toml",
  "servers/sexusb/Cargo.toml",
  "purple-scanout/Cargo.toml",
  "servers/silkbar/Cargo.toml",
  "servers/linen/Cargo.toml",
  "servers/quil/Cargo.toml",
  "servers/sexstore/Cargo.toml",
  "servers/sexfiles/Cargo.toml",
  "apps/spindle/Cargo.toml",
  "servers/sexnet/Cargo.toml",
  "servers/sext/Cargo.toml",
  "apps/kaleidoscope/Cargo.toml",
  "apps/hello/Cargo.toml",
  "apps/fortune/Cargo.toml",
  "apps/hum/Cargo.toml",
  "apps/jot/Cargo.toml",
  "apps/files/Cargo.toml",
  "apps/peek/Cargo.toml",
  "apps/talk/Cargo.toml",
  "apps/view/Cargo.toml",
  "apps/heaptest/Cargo.toml",
  "apps/bench/Cargo.toml",
  "apps/wasm/Cargo.toml",
  "apps/shapes/Cargo.toml",
  "apps/monitor/Cargo.toml",
  "apps/fputest/Cargo.toml",
  "apps/fuzz/Cargo.toml",
  "apps/jit/Cargo.toml",
  "apps/threads/Cargo.toml",
  "apps/web/Cargo.toml",
  "apps/play/Cargo.toml",
  "apps/cpp/Cargo.toml",
  "apps/stdhello/Cargo.toml",
  "apps/stdnet/Cargo.toml",
  "apps/ssh/Cargo.toml",
  "apps/chello/Cargo.toml",
  "apps/pdf/Cargo.toml",
  "apps/settings/Cargo.toml",
  "apps/lua/Cargo.toml",
  "apps/rg/Cargo.toml",
  "apps/fd/Cargo.toml",
  "apps/bat/Cargo.toml",
  "apps/python/Cargo.toml",
  "apps/store/Cargo.toml",
  "apps/sdltest/Cargo.toml",
  "apps/driftspark/Cargo.toml"
]


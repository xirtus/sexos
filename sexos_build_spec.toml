# ── SilkBar Integration Status ──────────────────────────────────────────────────
#
# silkbar  → producer stub (v7). Owns SilkBarUpdateQueue, no PDX transport yet.
#            v8+ will connect to sexdisplay via PDX for live updates.
# sexdisplay → local model consumer. Owns mutable SilkBar + queue, drains each frame.
#            Remains sole renderer until v8. No kernel behavior change.
# ────────────────────────────────────────────────────────────────────────────────

[spec]
version = "1.0.0"
abi_version_hash = "a3fa250a8a156f23ff0ab18bdfc12d9243d180f55dee530df029fa8f2698fc58"
contract_sha256 = "b0fb8b9db16d1b450f9d0c0c1c51b4566a7ae2c352087093f21e23e2bcc5c4d1"
target = "x86_64-sex.json"

[forbidden_env]
vars = [
  "SEXOS_BUILD_MODE",
  "SEXOS_BUILD_PROFILE",
  "SEXOS_DISABLE_ABI_GUARD",
  "SEXOS_SKIP_CONTRACT",
  "CARGO_FEATURES",
  "CARGO_BUILD_TARGET",
  "RUSTC_BOOTSTRAP"
]
prefixes = ["CARGO_FEATURE_"]

[allowed]
crates = [
  "sex-kernel",
  "servers/sexbell/Cargo.toml",
  "servers/sexdisplay/Cargo.toml",
  "apps/sexdrive/Cargo.toml",
  "servers/silk-shell/Cargo.toml",
  "servers/sexinput/Cargo.toml",
  "servers/sexusb/Cargo.toml",
  "purple-scanout/Cargo.toml",
  "servers/silkbar/Cargo.toml",
  "servers/linen/Cargo.toml",
  "servers/quil/Cargo.toml",
  "servers/sexstore/Cargo.toml",
  "servers/sexfiles/Cargo.toml",
  "apps/spindle/Cargo.toml",
  "servers/sexnet/Cargo.toml",
  "servers/sext/Cargo.toml",
  "apps/kaleidoscope/Cargo.toml"
]

[[stage]]
id = "prep_iso_root"
action = "prep_iso_root"
artifacts = ["iso_root"]

[[stage]]
id = "copy_limine"
action = "copy_limine"
artifacts = [
  "iso_root/boot/limine/limine-bios-cd.bin",
  "iso_root/boot/limine/limine-uefi-cd.bin",
  "iso_root/boot/limine/limine-bios.sys"
]

[[stage]]
id = "build_kernel"
action = "cargo_pkg"
package = "sex-kernel"
rustflags = ""
source_artifact = "target/x86_64-sex/release/sex-kernel"
dest_artifact = "iso_root/sexos-kernel"

[[stage]]
id = "build_sexdisplay"
action = "cargo_manifest"
manifest = "servers/sexdisplay/Cargo.toml"
source_artifact = "target/x86_64-sex/release/sexdisplay"
dest_artifact = "iso_root/servers/sexdisplay"

[[stage]]
id = "build_sexdrive"
action = "cargo_manifest"
manifest = "apps/sexdrive/Cargo.toml"
source_artifact = "target/x86_64-sex/release/sexdrive"
dest_artifact = "iso_root/apps/sexdrive"

[[stage]]
id = "build_silk_shell"
action = "cargo_manifest"
manifest = "servers/silk-shell/Cargo.toml"
source_artifact = "target/x86_64-sex/release/silk-shell"
dest_artifact = "iso_root/servers/silk-shell"

[[stage]]
id = "build_sexinput"
action = "cargo_manifest"
manifest = "servers/sexinput/Cargo.toml"
source_artifact = "target/x86_64-sex/release/sexinput"
dest_artifact = "iso_root/servers/sexinput"
rustflags = ""

[[stage]]
id = "build_sexusb"
action = "cargo_manifest"
manifest = "servers/sexusb/Cargo.toml"
source_artifact = "target/x86_64-sex/release/sexusb"
dest_artifact = "iso_root/servers/sexusb"

[[stage]]
id = "build_purple_scanout"
action = "cargo_manifest"
manifest = "purple-scanout/Cargo.toml"
source_artifact = "target/x86_64-sex/release/purple-scanout"
dest_artifact = "iso_root/apps/purple-scanout"

# silkbar: producer stub (v7). No PDX transport. sexdisplay remains local model consumer until v8.
[[stage]]
id = "build_silkbar"
action = "cargo_manifest"
manifest = "servers/silkbar/Cargo.toml"
source_artifact = "target/x86_64-sex/release/silkbar"
dest_artifact = "iso_root/servers/silkbar"

[[stage]]
id = "build_linen"
action = "cargo_manifest"
manifest = "servers/linen/Cargo.toml"
source_artifact = "target/x86_64-sex/release/linen"
dest_artifact = "iso_root/servers/linen"

[[stage]]
id = "build_quil"
action = "cargo_manifest"
manifest = "servers/quil/Cargo.toml"
source_artifact = "target/x86_64-sex/release/quil"
dest_artifact = "iso_root/servers/quil"
rustflags = "--cfg sexfiles_quil_persistence_proof"

[[stage]]
id = "build_sexstore"
action = "cargo_manifest"
manifest = "servers/sexstore/Cargo.toml"
source_artifact = "target/x86_64-sex/release/sexstore"
dest_artifact = "iso_root/servers/sexstore"

[[stage]]
id = "build_sexbell"
action = "cargo_manifest"
manifest = "servers/sexbell/Cargo.toml"
source_artifact = "target/x86_64-sex/release/sexbell"
dest_artifact = "iso_root/servers/sexbell"
rustflags = ""

[[stage]]
id = "build_sexfiles"
action = "cargo_manifest"
manifest = "servers/sexfiles/Cargo.toml"
source_artifact = "target/x86_64-sex/release/sexfiles"
dest_artifact = "iso_root/servers/sexfiles"

[[stage]]
id = "build_spindle"
action = "cargo_manifest"
manifest = "apps/spindle/Cargo.toml"
source_artifact = "target/x86_64-sex/release/spindle"
dest_artifact = "iso_root/apps/spindle"

[[stage]]
id = "build_sexnet"
action = "cargo_manifest"
manifest = "servers/sexnet/Cargo.toml"
source_artifact = "target/x86_64-sex/release/sexnet"
dest_artifact = "iso_root/servers/sexnet"

[[stage]]
id = "build_kaleidoscope"
action = "cargo_manifest"
manifest = "apps/kaleidoscope/Cargo.toml"
source_artifact = "target/x86_64-sex/release/kaleidoscope"
dest_artifact = "iso_root/apps/kaleidoscope"
rustflags = ""

[[stage]]
id = "build_sext"
action = "cargo_manifest"
manifest = "servers/sext/Cargo.toml"
source_artifact = "target/x86_64-sex/release/sext"
dest_artifact = "iso_root/servers/sext"

[[stage]]
id = "copy_limine_cfg"
action = "copy_file"
src = "limine.cfg"
dst = "iso_root/limine.cfg"
artifacts = ["iso_root/limine.cfg"]

[[stage]]
id = "package_iso"
action = "package_iso"
artifacts = ["sexos-v1.0.0.iso"]

[[stage]]
id = "limine_bios_install"
action = "limine_bios_install"
artifacts = ["sexos-v1.0.0.iso"]

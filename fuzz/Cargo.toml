# SPDX-License-Identifier: GPL-3.0-only
[workspace]

[package]
name = "sexos-fuzz"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[package.metadata]
cargo-fuzz = true

[features]
default = []
with-sex-torrent = []
with-sex-kodi = []

[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "6e03f65bf45181db77ba6229716e6624db9eb25b" }

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.4", features = ["derive"] }

# sexos master crates
sex-archive = { path = "../crates/sex-archive" }
vellum-edit = { path = "../crates/vellum-edit" }
sex-image = { path = "../crates/sex-image" }
gaze-codecs = { path = "../crates/gaze-codecs" }
sex-html = { path = "../crates/sex-html" }
sex-http = { path = "../crates/sex-http" }
sex-volumes = { path = "../crates/sex-volumes" }
sex-font = { path = "../crates/sex-font" }
sex-mail = { path = "../crates/sex-mail" }
sex-ebook = { path = "../crates/sex-ebook" }
sex-feed = { path = "../crates/sex-feed" }
gridcraft-engine = { git = "https://github.com/storytold/gridcraft", rev = "c0ee120ac2d9b59630f5abf1151dd9b471fe2926" }
wordcraft-engine = { git = "https://github.com/storytold/wordcraft", rev = "a4b898f820eb28626865292fd037a155e4a07aef" }
serde_json = "1"
crc32fast = "1.4"
miniz_oxide = "0.9"
sex-extensions = { path = "../crates/sex-extensions" }
sex-shields = { path = "../crates/sex-shields" }
burlesque-core = { path = "../crates/burlesque-core" }
batik-core = { path = "../crates/batik-core" }
sex-bt = { path = "../crates/sex-bt" }
sex-hid-touch = { path = "../crates/sex-hid-touch" }
sex-torrent = { path = "../crates/sex-torrent" }

[[bin]]
name = "fuzz_archive"
path = "fuzz_targets/fuzz_archive.rs"
test = false
doc = false


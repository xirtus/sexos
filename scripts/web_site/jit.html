<!doctype html><title>Baseline bytecode JIT</title><h1>Baseline bytecode JIT</h1><p id=result>Running</p>
<script>
function add(a,b) { return a+b; }
function sub(a,b) { return a-b; }
function mul(a,b) { return a*b; }
function mix(a,b) { return ((a+b)*3) ^ (a-b); }
function flags(x) { return !!(x&1) && !!(x&2) || !!(x&4); }
function choose(x) { return x && 7; }
function less(a,b) { return a < b; }
let total=0;
for(let i=0;i<10000;i++) total+=mix(i,7);
for(let i=0;i<64;i++) {add(i,7);sub(i,7);mul(i,7);}
let truth=0;
for(let i=-512;i<512;i++) { if(flags(i)) truth++; choose(i); less(i,7); }
const flow=[truth,typeof flags(3),flags(3),flags(0),choose(0),choose(-1),typeof choose(0),less(-2147483648,2147483647),typeof less(1,2),flags(NaN),flags(-0),choose(-0),Object.is(choose(-0),-0),choose('text')].join(',');
const result=[total,add(2147483647,1),sub(-2147483648,1),mul(65536,65536),Object.is(mul(-1,0),-0),add('a',1),add(true,1),flow].join('|');
document.getElementById('result').textContent=result;
console.log('jit-result',result);
function captured() {
  let state=1;
  return {read(){return state;},set(v){state=v;},equal(v){return state===v;}};
}
const cell=captured();
for(let i=0;i<96;i++){cell.read();cell.equal(i);}
cell.set(true);
for(let i=0;i<96;i++){cell.read();cell.equal(true);}
const capture=[cell.read(),typeof cell.read(),cell.equal(1)];
cell.set(17);capture.push(cell.read(),typeof cell.read());
const object={x:42};cell.set(object);capture.push(cell.read()===object);
cell.set(-0);capture.push(Object.is(cell.read(),-0));
cell.set(undefined);capture.push(cell.read()===undefined);
let effects=0;function effect(){return ++effects;}
for(let i=0;i<96;i++)effect();capture.push(effects);
// Cold one-shot bytecode must not permanently fill the admission cache.
for(let i=0;i<96;i++)new Function('return '+(i+100))();
function later(a){return (a+7)^3;}
let sum=0;for(let i=0;i<128;i++)sum+=later(i);capture.push(sum);
console.log('jit-captured',capture.join('|'));
// Own-property cache: fresh values and descriptor/slot changes, never getters.
let cacheObject={value:0,pad:1}, cacheSum=0;
function cacheRead(o){return o.value;}
for(let i=0;i<500;i++){cacheObject.value=i;cacheSum+=cacheRead(cacheObject);}
let cacheResults=[cacheSum];
cacheObject.value={name:'retained'};let cacheHeld=cacheRead(cacheObject);
cacheObject.value='replacement';cacheResults.push(cacheHeld.name,cacheRead(cacheObject));
delete cacheObject.value;Object.setPrototypeOf(cacheObject,{value:'prototype'});
cacheResults.push(cacheRead(cacheObject));
let cacheGets=0;Object.defineProperty(cacheObject,'value',{configurable:true,get(){cacheGets++;return 'getter';}});
cacheResults.push(cacheRead(cacheObject),cacheRead(cacheObject),cacheGets);
Object.defineProperty(cacheObject,'value',{configurable:true,writable:true,value:'own'});
cacheResults.push(cacheRead(cacheObject));
delete cacheObject.value;cacheObject.other='wrong';cacheObject.value='right';
cacheResults.push(cacheRead(cacheObject));
let cacheTraps=0;let cacheProxy=new Proxy(cacheObject,{get(t,k){cacheTraps++;return Reflect.get(t,k);}});
cacheResults.push(cacheRead(cacheProxy),cacheRead(cacheProxy),cacheTraps);
console.log('jit-object-cache',cacheResults.join('|'));
// String operations exercise Latin-1, UTF-16, lone surrogates and NUL.
const stringWords=['','a','é','Ā','\ud800','\udfff','😀','\0'];
let stringLength=0,stringCodes=0,stringComparisons=[0,0,0,0,0,0,0,0];
for(const a of stringWords)for(const b of stringWords){
 const joined=a+b;stringLength+=joined.length;
 for(let i=0;i<joined.length;i++)stringCodes+=joined.charCodeAt(i);
 const flags=[a<b,a<=b,a>b,a>=b,a==b,a!=b,a===b,a!==b];
 for(let i=0;i<8;i++)stringComparisons[i]+=flags[i]?1:0;
}
let stringOrder=[];
const stringLeft={valueOf(){stringOrder.push('left');return 'a';}};
const stringRight={valueOf(){stringOrder.push('right');return 'b';}};
const stringCoerced=stringLeft+stringRight;
console.log('jit-strings',[stringLength,stringCodes,stringComparisons.join(','),stringCoerced,stringOrder.join(',')].join('|'));

function nativeJoin(a,b){return a+b;}
function nativeLess(a,b){return a<b;}
function nativeEqual(a,b){return a===b;}
let heapCodes=0,heapLess=0,heapEqual=0;
for(let round=0;round<4;round++)for(const a of stringWords)for(const b of stringWords){
 const joined=nativeJoin(a,b);
 if(joined!==a+b || nativeLess(a,b)!==(a<b) || nativeEqual(a,b)!==(a===b))throw Error('native heap mismatch');
 for(let i=0;i<joined.length;i++)heapCodes+=joined.charCodeAt(i);
 heapLess+=nativeLess(a,b)?1:0;heapEqual+=nativeEqual(a,b)?1:0;
}
if(nativeJoin('x'.repeat(256),'y').length!==257)throw Error('bounded fallback');
console.log('jit-heap-values',[heapCodes,heapLess,heapEqual].join('|'));

function nativeIdentity(o){return o!=null && o===o.self;}
let identityObject={self:null},identityYes=0;
for(let i=0;i<256;i++){identityObject.self=(i&1)?identityObject:null;identityYes+=nativeIdentity(identityObject)?1:0;}
if(identityYes!==128 || nativeIdentity(null) || nativeIdentity(undefined))throw Error('identity');
let identityGets=0;Object.defineProperty(identityObject,'self',{get(){identityGets++;return identityObject;}});
if(!nativeIdentity(identityObject)||identityGets!==1)throw Error('identity getter');
console.log('jit-identity',identityYes,identityGets);
</script>

<!doctype html><html><head><title>Viewport test</title><style>
html,body{margin:0;width:100%;height:100%;background:#173a5e}
#edge{position:absolute;right:0;bottom:0;width:48px;height:48px;background:#71c9b0}
#origin{position:absolute;left:0;top:0;width:48px;height:48px;background:#9384c8}
</style></head><body><div id=origin></div><div id=edge></div><script>
let count = 0;
function report() { console.log('viewport size ' + innerWidth + 'x' + innerHeight + ' count=' + count); }
addEventListener('resize', () => { count++; report(); });
report();
</script></body></html>

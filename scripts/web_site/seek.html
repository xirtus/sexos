<!doctype html>
<html><head><title>seek test</title></head>
<body style="margin:0;background:#fff">
<!-- Arrives slowly; a second after it plays, the page jumps to 8 s. -->
<video id="v" src="stream.mp4" autoplay></video>
<script>
const log = m => console.log(m);
const v = document.getElementById('v');
let asked = 0, moved = false;
v.addEventListener('playing', () => {
  if (asked) return;
  log('playing');
  setTimeout(() => { asked = Date.now(); v.currentTime = 8; log('seek to 8'); }, 1000);
});
setInterval(() => {
  if (asked && !moved && v.currentTime >= 8.2) { moved = true; log('moved after ' + (Date.now() - asked)); }
}, 50);
v.addEventListener('ended', () => log('ended at ' + v.currentTime.toFixed(1)));
</script>
</body></html>

<!doctype html>
<html><head><title>Frame test</title>
<style>body{margin:0;background:#fff;font:14px sans-serif}#f{position:absolute;left:20px;top:40px;width:200px;height:120px;border:0}</style></head>
<body><p id=s>waiting</p>
<iframe id=f referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script>
// The frame is another origin (another port); its address comes from ours.
const other = location.origin.replace(/:(\d+)$/, (m, p) => ':' + (+p + 1));
const f = document.getElementById('f');
let loaded = 0;
f.addEventListener('load', () => { loaded++; console.log('frame load event'); });
window.addEventListener('message', e => {
  const d = e.data;
  if (e.origin !== other || e.source !== f.contentWindow) { console.log('frames fail source ' + e.origin); return; }
  if (d.hello) {
    const ok = d.framed && d.parentOrigin === location.origin && d.referrer === location.origin + '/';
    console.log(ok ? 'frames ok' : 'frames fail ' + JSON.stringify(d));
    document.getElementById('s').textContent = ok ? 'frame says hello' : 'bad hello';
    f.contentWindow.postMessage({ reply: 'hi frame' }, other);
    // Sent to the wrong origin: must not arrive.
    f.contentWindow.postMessage({ reply: 'leak' }, 'http://elsewhere.example');
  }
  if (d.clicked) console.log('frame clicked ' + d.clicked);
});
f.src = other + '/site/framed.html';
</script></body></html>

<!doctype html>
<html><head><title>three.js test</title>
<style>body { margin: 12px; } h1 { font-size: 18px; margin: 0 0 6px; } canvas { border: 1px solid #c4c7c5; }</style></head>
<body>
<h1>three.js</h1>
<canvas id="c" width="380" height="200"></canvas>
<p><button id="spin">Turn</button> <span id="state">frames: 0</span></p>
<script>var exports = {}; var module = { exports: exports };</script>
<script src="three/three.cjs"></script>
<script>
const THREE = exports;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4f4f8);
const camera = new THREE.PerspectiveCamera(50, canvas.width / canvas.height, 0.1, 100);
camera.position.set(0, 0.2, 4.6);
camera.lookAt(0, 0, 0);
const cube = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshStandardMaterial({ color: 0x3377ee, roughness: 0.4 }));
cube.position.x = -1.1;
const ball = new THREE.Mesh(new THREE.SphereGeometry(0.75, 24, 12), new THREE.MeshPhongMaterial({ color: 0xea4335, shininess: 60 }));
ball.position.x = 1.1;
scene.add(cube, ball);
// Along the bottom: instanced cubes colored per instance (instanceMatrix is a mat4
// attribute), a BatchedMesh (float and integer data textures read with texelFetch), a
// skinned bar bent by its second bone (bone matrices in a float texture) and a box widened
// by a morph target (a 2D array texture).
const small = new THREE.BoxGeometry(0.3, 0.3, 0.3);
const inst = new THREE.InstancedMesh(small, new THREE.MeshLambertMaterial(), 3);
[0x34a853, 0xfbbc05, 0x4285f4].forEach((c, i) => {
  inst.setMatrixAt(i, new THREE.Matrix4().makeTranslation(-2.1 + i * 0.4, -1.15, 0));
  inst.setColorAt(i, new THREE.Color(c));
});
const batch = new THREE.BatchedMesh(2, 600, 1200, new THREE.MeshLambertMaterial({ color: 0xffffff }));
const bs = batch.addInstance(batch.addGeometry(new THREE.SphereGeometry(0.2, 12, 6)));
const bb = batch.addInstance(batch.addGeometry(small));
batch.setMatrixAt(bs, new THREE.Matrix4().makeTranslation(-0.55, -1.15, 0));
batch.setMatrixAt(bb, new THREE.Matrix4().makeTranslation(-0.05, -1.15, 0));
batch.setColorAt(bs, new THREE.Color(0xff6d00));
batch.setColorAt(bb, new THREE.Color(0x9c27b0));
const bar = new THREE.BoxGeometry(0.2, 0.8, 0.2, 1, 6, 1);
const skinIndex = [], skinWeight = [];
for (let i = 0; i < bar.attributes.position.count; i++) {
  const w = Math.min(1, Math.max(0, (bar.attributes.position.getY(i) + 0.4) / 0.8));
  skinIndex.push(0, 1, 0, 0); skinWeight.push(1 - w, w, 0, 0);
}
bar.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(skinIndex, 4));
bar.setAttribute('skinWeight', new THREE.Float32BufferAttribute(skinWeight, 4));
const root = new THREE.Bone(), tip = new THREE.Bone();
root.position.y = -0.4; tip.position.y = 0.4; root.add(tip);
const skinned = new THREE.SkinnedMesh(bar, new THREE.MeshLambertMaterial({ color: 0x00acc1 }));
skinned.add(root); skinned.bind(new THREE.Skeleton([root, tip]));
tip.rotation.z = 0.9; skinned.position.set(0.7, -1.1, 0);
const wide = new THREE.BoxGeometry(0.3, 0.3, 0.3), stretched = wide.attributes.position.clone();
for (let i = 0; i < stretched.count; i++) stretched.setX(i, stretched.getX(i) * 2.5);
wide.morphAttributes.position = [stretched];
const morph = new THREE.Mesh(wide, new THREE.MeshLambertMaterial({ color: 0xd81b60 }));
morph.morphTargetInfluences = [1]; morph.position.set(1.7, -1.15, 0);
scene.add(inst, batch, skinned, morph);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const light = new THREE.DirectionalLight(0xffffff, 2.2);
light.position.set(2, 3, 4);
scene.add(light);
// Render to texture: a second camera's view of the cube shows on a panel.
const target = new THREE.WebGLRenderTarget(48, 32);
const eye = new THREE.PerspectiveCamera(50, 1.5, 0.1, 100);
eye.position.set(0, 0, 3.2);
const panel = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.6), new THREE.MeshBasicMaterial({ map: target.texture }));
panel.position.set(2.0, 1.0, 0);
scene.add(panel);
function draw() {
  panel.visible = false;
  renderer.setRenderTarget(target);
  renderer.render(scene, eye);
  renderer.setRenderTarget(null);
  panel.visible = true;
  renderer.render(scene, camera);
}
let frames = 0;
function step() {
  cube.rotation.x += 0.12; cube.rotation.y += 0.17; ball.rotation.y += 0.2;
  draw();
  frames++;
  document.getElementById('state').textContent = 'frames: ' + frames;
  if (frames % 6) requestAnimationFrame(step); else console.log('three frames', frames);
}
document.getElementById('spin').addEventListener('click', () => requestAnimationFrame(step));
draw();
requestAnimationFrame(step);
</script>
</body></html>

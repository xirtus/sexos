name: SexOS build setup
description: Build tools, Rust cache, FFmpeg/libc++ caches and Limine.
inputs:
  qemu:
    description: Install QEMU and image tools
    default: "true"
  media:
    description: Restore or build FFmpeg and libc++
    default: "true"
  recording:
    description: Build the optional FFV1/Matroska recording profile
    default: "false"
  save-cache:
    description: Save the cargo registry cache after this job (one job per run, on master)
    default: "false"
  target-cache:
    description: >-
      Restore the image build's cargo target directory (`image`, saved by the image
      job on master with .github/actions/save-target), or `none` for host-only jobs
    default: image
  limine:
    description: Fetch and build Limine
    default: "true"
runs:
  using: composite
  steps:
  - name: Rebuild by file contents, not modification times
    shell: bash
    # A fresh checkout gives every file a new mtime, so the restored cargo cache
    # used to rebuild every workspace crate anyway (~25 minutes per image build).
    # With checksums only crates whose sources really changed rebuild. Set before
    # the cargo cache step: the variable is part of its key, so every workflow
    # using this action shares one cache.
    run: echo "CARGO_UNSTABLE_CHECKSUM_FRESHNESS=true" >> "$GITHUB_ENV"
  - name: Install build tools
    shell: bash
    run: |
      # Skip man-page index rebuilds, the slowest part of apt on the runners.
      sudo rm -f /var/lib/man-db/auto-update
      # A stalled mirror connection otherwise hangs apt for 20+ minutes (Host regressions
      # timed out twice on PR #433 inside `apt-get install ffmpeg`). Every later apt call
      # in the job reads this too: give up on a dead connection fast and retry.
      printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/99sexos-ci-net >/dev/null
      pkgs="ripgrep clang lld llvm wabt nasm musl-dev cmake ninja-build meson acpica-tools mtools gdisk dosfstools"
      if [[ "${{ inputs.qemu }}" == true ]]; then pkgs="$pkgs xorriso qemu-system-x86"; fi
      sudo apt-get update -qq
      sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $pkgs
  - name: Rust toolchain cache
    uses: actions/cache@v4
    with:
      path: |
        ~/.rustup/toolchains
        ~/.rustup/update-hashes
        ~/.rustup/settings.toml
      key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
  - name: Cargo registry cache
    uses: Swatinem/rust-cache@v2
    with:
      shared-key: sexos
      cache-all-crates: true
      # The target directory has its own cache below: rust-cache's cleanup keeps
      # only packages `cargo metadata` lists, so it deleted the -Z build-std units
      # (core, alloc, std, compiler_builtins) and every crate above them rebuilt in
      # every job (~25-30 minutes per image build, even on a full cache hit).
      cache-targets: false
      cache-on-failure: true
      save-if: ${{ inputs.save-cache == 'true' && github.ref == 'refs/heads/master' }}
  - name: Cargo target cache (the newest master image build)
    if: inputs.target-cache != 'none'
    uses: actions/cache/restore@v4
    with:
      # Keep in step with .github/actions/save-target: the paths are part of the cache version.
      path: |
        target
        !target/ffmpeg
        !target/libcxx
        !target/**/incremental
      key: target-${{ inputs.target-cache }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ github.run_id }}
      restore-keys: target-${{ inputs.target-cache }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
  - name: Fetch crates (builds and host gates run offline)
    shell: bash
    run: cargo fetch --locked
  - name: Cache FFmpeg
    if: inputs.media == 'true'
    uses: actions/cache@v4
    with:
      path: |
        target/ffmpeg/lib
        target/ffmpeg/include
        target/ffmpeg/include-c
        target/ffmpeg/sexos-recording-v1
        target/ffmpeg/sexos-audio-export-v1
        target/ffmpeg/share/licenses
        target/ffmpeg/source-pin
      key: ffmpeg-${{ inputs.recording }}-${{ hashFiles('scripts/build_ffmpeg.sh', 'scripts/build_dav1d.sh', 'scripts/build_shine.sh', 'scripts/build_libvpx.sh', 'scripts/build_libaom.sh', 'scripts/build_x264.sh') }}
  - name: Build FFmpeg for programs
    if: inputs.media == 'true'
    shell: bash
    run: |
      profile=0
      # The recording profile also enables Splicy's VP9/Opus/AAC export.
      if [[ "${{ inputs.recording }}" == true ]]; then profile=2; fi
      # sex-media's build script reruns when this changes (restored files keep old mtimes).
      echo "SEXOS_FFMPEG_PROFILE=$profile" >> "$GITHUB_ENV"
      if [[ ! -f target/ffmpeg/lib/libavcodec.a ]] || [[ ! -f target/ffmpeg/lib/libshine.a ]] || [[ "$(cat target/ffmpeg/sexos-audio-export-v1 2>/dev/null)" != 1 ]] || [[ "$(cat target/ffmpeg/sexos-recording-v1 2>/dev/null)" != "$profile" ]]; then
        FFMPEG_RECORDING=$profile bash scripts/build_ffmpeg.sh
      fi
  - name: Cache libc++
    if: inputs.media == 'true'
    uses: actions/cache@v4
    with:
      path: |
        target/libcxx/lib
        target/libcxx/include
        target/libcxx/include-c
      key: libcxx-${{ hashFiles('scripts/build_libcxx.sh') }}
  - name: Build libc++ for programs
    if: inputs.media == 'true'
    shell: bash
    run: test -f target/libcxx/lib/libc++.a || bash scripts/build_libcxx.sh
  - name: Prepare Limine
    if: inputs.limine == 'true'
    shell: bash
    run: |
      git init -q limine
      git -C limine remote add origin https://github.com/limine-bootloader/limine.git
      git -C limine fetch -q --depth=1 origin ca3a5b20d2501e3819983c5cf838c70c30ee532a
      git -C limine checkout -q --detach FETCH_HEAD
      # Limine 7.13.3's BIOS countdown can hang before the kernel (see the script).
      python3 scripts/patch_limine_bios.py limine
      make -C limine limine

name: IPC bench (WS4 working branch)

# Temporary: measures the IPC round trip on the WS4 branch while the fast paths are
# built. The lasting bench steps move into ci.yml before the branch merges.
on:
  push:
    branches: [ claude/project-thread-aql7vg ]
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
    - name: Build the image
      run: ./scripts/entrypoint_build.sh > "$RUNNER_TEMP/build.log" 2>&1 || (tail -80 "$RUNNER_TEMP/build.log"; exit 1)
    - name: Blank program disk
      run: truncate -s 1G "$RUNNER_TEMP/blank-programs.img"
    - name: Bench, 1 core, no PKU
      run: SEXOS_GATE_CPU=max,-pku,+rdseed python3 scripts/program_bench_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$RUNNER_TEMP/b/1np"
    - name: Bench, 4 cores, no PKU
      if: always()
      run: SEXOS_GATE_CORES=4 SEXOS_GATE_CPU=max,-pku,+rdseed python3 scripts/program_bench_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$RUNNER_TEMP/b/4np"
    - name: Bench, 1 core, PKU
      if: always()
      run: python3 scripts/program_bench_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$RUNNER_TEMP/b/1pku"
    - name: Latency gate, 1 core
      if: always()
      run: python3 scripts/latency_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$RUNNER_TEMP/b/lat1"
    - name: Latency gate, 4 cores
      if: always()
      run: SEXOS_GATE_CORES=4 python3 scripts/latency_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$RUNNER_TEMP/b/lat"
    - name: Profile lines
      if: always()
      run: |
        for d in "$RUNNER_TEMP"/b/*; do echo "== $d"; grep -ahE '\[bench\] |\[ipc\.prof\]|\[sched\.latency|p99' "$d"/*.log "$d"/*serial* 2>/dev/null | grep -v "^\[sched" | tail -12; cat "$d"/*.json 2>/dev/null; ls "$d"; done
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ipc-bench
        path: ${{ runner.temp }}/b
        if-no-files-found: ignore

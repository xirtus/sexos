name: Rust CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y ripgrep
    - name: Enforce root allowlist
      run: bash scripts/dev/check_root_allowlist.sh --strict
    - name: Build via single entrypoint (mandatory)
      run: bash scripts/entrypoint_build.sh

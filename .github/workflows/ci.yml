name: Rust CI

# Gates run as parallel jobs. Each job sets up from shared caches (rustup,
# cargo + target, FFmpeg, libc++). The `image` job builds the default image once
# (the mandatory entrypoint gate) and the jobs that test that image unpack it
# (.github/actions/image); only jobs with their own build flags (profiles,
# recording, input proof) build again. Every gate of the former single job still runs.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: Host regressions
    runs-on: ubuntu-latest
    # 23 min warm; a cold cargo cache (after a red master) needs more.
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
      with:
        qemu: "false"
    - name: Enforce root allowlist
      run: bash scripts/dev/check_root_allowlist.sh --strict
    - name: Host proof regressions
      run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_*.py'
    - name: Other systems' filesystems (FAT, exFAT, ext4, NTFS) on the host
      run: bash scripts/volumes_host_gate.sh
    - name: IOMMU tables, page tables and lending window on the host
      run: bash scripts/iommu_host_gate.sh
    - name: IPC v2 endpoints, reply capabilities and notifications on the host
      run: bash scripts/ipc_v2_host_gate.sh
    - name: Display model (KMS, EDID) and Intel Gen12 display engine on the host
      run: bash scripts/kms_host_gate.sh
    - name: sexdrive DMA lifetime and zero-copy reads on the host
      run: bash scripts/sexdrive_dma_host_gate.sh
    - name: Intel RAID (IMSM metadata, VMD bus) on the host
      run: bash scripts/raid_host_gate.sh
    - name: Hardware census table (names, owners, VMD warning) on the host
      run: bash scripts/hwdb_host_gate.sh
    - name: Rounded window corners and soft shadows (Display decoration pass) on the host
      run: bash scripts/display_decor_host_gate.sh
    - name: Deadline scheduling class (earliest first, share of each window) on the host
      run: bash scripts/scheduler_deadline_host_gate.sh
    - name: Velvet game rules and Weft input integration
      run: cargo test --locked -p velvet --no-default-features
    - name: Moan Weft app and project editing
      run: cargo test --locked -p moan --no-default-features
    - name: Moan native FFmpeg WAV, FLAC and Shine MP3 export oracle
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
        bash scripts/moan_export_host_gate.sh
    - name: Moan timeline, edits and mixer on the host
      run: bash scripts/moan_host_gate.sh
    - name: Bell sound rate conversion on the host
      run: bash scripts/sound_host_gate.sh
    - name: Qupid keep-watching logic (episodes, skip and up-next cards) on the host
      run: bash scripts/qupid_host_gate.sh
    - name: Qupid Kodi repositories (addons.xml, versions, dependencies, checksums, addon zips) on the host
      run: cargo test --locked -p sex-kodi
    - name: Explicit program heap limits with actual Talc
      run: bash scripts/program_heap_limit_host_gate.sh
    - name: Unarmed recorder custody and restart contracts
      run: bash scripts/desktop_recording_host_gate.sh
    - name: Native screenshot custody and PNG output on the host
      run: bash scripts/desktop_capture_host_gate.sh
    - name: HTML containing-block and replaced sizing
      run: cargo test --locked -p sex-html
    - name: Leather SDK sample models and real Weft widgets
      run: cargo test --locked -p leather-samples --no-default-features
    - name: Live autofill capability broker and SDK (host transport)
      run: bash scripts/autofill_host_gate.sh
    - name: Chastity encrypted vault and Weft UI
      run: bash scripts/chastity_host_gate.sh
    - name: Shields ad and tracker filters (Kaleidoscope, Qupid)
      run: cargo test --locked -p sex-shields
    - name: Browser extensions (manifests, match patterns, CRX/ZIP, declarativeNetRequest)
      run: cargo test --locked -p sex-extensions
    - name: Settings schema, file format, protocol and the Settings program's pages
      run: bash scripts/settings_host_gate.sh
    - name: egui backend (input mapping, CPU rasterizer, whole frames of the egui demo)
      run: cargo test --locked -p sex-egui
    - name: Weft toolkit and Abacus (layout, input, menus, palette, dialogs, tabs, accessibility)
      run: cargo test --locked -p weft --features color-emoji && cargo test --locked -p abacus --no-default-features
    - name: Signed package format and store catalog
      run: cargo test --locked -p sex-pkg
    - name: Spreadeagle workbook engine and office painting (host)
      run: cargo test --locked -p spreadeagle -p assuit -p sex-office
    - name: Disk layouts (GPT, FAT, install beside other systems)
      run: cargo test --locked -p sex-disk --lib
    - name: Keyboard layouts, dead keys and Compose
      run: cargo test --locked -p sex-keymap
    - name: Fonts (fallbacks, colour emoji, bold and italic, hinting, darkening, gamma), icon set and theme tokens
      run: cargo test --locked -p sex-font -p sex-icons -p sex-theme && python3 scripts/brand/icons.py --check
    - name: Shaping (rustybuzz vs hb-shape), Arabic joining and bidi
      run: cargo test --locked -p sex-shape --features shaping
    - name: Shuttle userspace font fallback, RTL/BiDi shaping and font picker on the host
      run: bash scripts/shuttle_host_gate.sh
    - name: Loom engines (batch rename, duplicates, usage map, tags, compare) on the host
      run: cargo test --locked -p loom-core
    - name: Vellum annotations, forms and incremental PDF saves on the host
      run: cargo test --locked -p vellum-edit
    - name: Gaze decoders (EXIF orientation, JPEG XL, SVG, RAW previews) on the host
      run: cargo test --locked -p gaze-codecs --all-features
    - name: Vellum app (annotation geometry, form order, thumbnails) on the host
      run: cargo test --locked -p pdf
    - name: Image codecs (WebP, animated GIF, AVIF, HEIC, 4-quadrant fidelity, 50k fuzzer) on the host
      run: bash scripts/sex_codecs_host_gate.sh
    - name: Aftercare backups (dedup, encryption, restore, prune, check) on the host
      run: cargo test --locked -p aftercare-core
    - name: Aftercare app (folder store, restore hashes, settings, schedule) on the host
      run: cargo test --locked -p aftercare
    - name: Loom archives (zip, tar, 7z, gz, zst, xz) with Python interop on the host
      run: cargo test --locked -p sex-archive --features std
    - name: Polyamour 3D core (meshes, modifiers, booleans, path tracer, glTF/OBJ/STL/PLY/.blend, polyops + Python API)
      run: bash scripts/polyamour/check_wasm_guest.sh && cargo test --locked --release -p sex-3d -p polyamour -p polyamour-sdk -p polyamour-wasm
    - name: Burlesque presentations engine (PPTX, ODP, presenter view, PDF export) on the host
      run: bash scripts/burlesque_host_gate.sh
    - name: Pinyin input method
      run: cargo test --locked -p sex-ime
    - name: Whisper voice (eSpeak NG speech, stop, determinism), its Shell wire and the a11y tree transport
      run: |
        cargo test --locked -p sex-speech
        cargo test --locked -p sex-pdx --test speech_voice
        cargo test --locked -p sex-pdx --test a11y
    - name: Denim page compression (compressed RAM codec)
      run: cargo test --locked -p denim
    - name: SNTP client codec (network time)
      run: cargo test --locked -p sex-ntp
    - name: Splicy editing core (timeline, edit by transcript, suggestions, render plan, OTIO)
      run: cargo test --locked -p sex-splice
    - name: Splicy window (delete a sentence on screen, its frames and sound are gone)
      run: bash scripts/splicy_host_gate.sh
    - name: Splicy export (WebM VP9+Opus, MP4 H.264+AAC, MP4 AV1+Opus) through system FFmpeg
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg pkg-config libavcodec-dev libavformat-dev libavutil-dev libswscale-dev
        python3 scripts/splicy_export_host_gate.py "$RUNNER_TEMP/splicy-export"
    - name: RFB (VNC) client and server codec, byte-exact goldens
      run: cargo test --locked -p sex-rfb
    - name: Serenade audio recorder engine (VOX, dBFS meters, waveform mipmaps, WAV/cue) on the host
      run: bash scripts/serenade_host_gate.sh
    - name: Flash UVC webcam protocol, server and capture app on the host
      run: bash scripts/flash_host_gate.sh
    - name: Multipass accounts, Shibari keeper (link fixtures, tokens never leave)
      run: cargo test --locked -p shibari -p sex-multipass
    - name: Valentine mail (IMAP IDLE + SMTP send-then-receive fixture, MIME, threads)
      run: cargo test --locked -p sex-mail
    - name: SexOS filesystem check and repair (injected faults)
      run: cargo test --locked --release -p sexfs --features repair --lib
    - name: Corset disks, GPT editor, FAT32/exFAT/SexFS formatters, SMART and BDSM encryption on the host
      run: bash scripts/corset_host_gate.sh
    - name: Corset plans (step sentences, typed-name confirmation, re-read before apply, write order) on the host
      run: cargo test --locked -p corset --lib
    - name: Network stack (IPv6 resolvers, accept backlog, UDP queues) on the host
      run: cargo test --locked -p sex-net --lib
    - name: HTTP/2 client (HPACK, 50 streams) against a real h2 server, plain and over TLS
      run: |
        python3 -m pip install --quiet --user --break-system-packages h2==4.4.1
        SEXOS_REQUIRE_H2=1 cargo test --locked -p sex-http --lib h2
        SEXOS_REQUIRE_H2=1 cargo test --locked -p sex-tls --features open-web --lib alpn
    - name: WireGuard protocol (Python peer interop) and SSH client (real OpenSSH) on the host
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends openssh-server
        # The runner account is password-locked; without PAM sshd refuses locked accounts even for keys.
        sudo usermod -p '*' "$USER"
        cargo test --locked -p sex-wg
        cargo test --locked -p sex-ssh
    - name: Loom network places (SFTP via real OpenSSH, WebDAV, S3 with SigV4) on the host
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends openssh-server openssh-sftp-server
        sudo usermod -p '*' "$USER"
        cargo test --locked -p loom-remote
    - name: Disk and CD images (ISO/UDF/qcow2/VHD/VHDX/VMDK, partitions) on the host
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends xorriso genisoimage udftools qemu-utils gdisk fdisk dosfstools e2fsprogs
        cargo test --locked -p sex-diskimage
    - name: BitTorrent engine (sex-torrent) goldens and protocol tests on the host
      run: cargo test --locked -p sex-torrent
    - name: Swingers downloads from and seeds to aria2 on the host
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends aria2 transmission-cli
        bash scripts/swingers_host_gate.sh
    - name: Needle printing and scanning protocols (IPP, PWG raster, DNS-SD, eSCL goldens)
      run: |
        cargo test --locked -p sex-print
        cargo build --locked -p needle
        python3 scripts/needle_host_test.py
    - name: Crash record format host regressions
      run: bash scripts/crash_log_host_gate.sh
    - name: Climax benchmark, torture runner and thermal throttling analyzer on the host
      run: bash scripts/climax_host_gate.sh
    - name: Experimental JS baseline JIT differential and emitted-code gates
      run: |
        SEXJS_NATIVE=0 cargo test --release -p sex-js --features baseline-jit -- --test-threads=1 --nocapture
        SEXJS_NATIVE=1 cargo test --release -p sex-js --features baseline-jit -- --test-threads=1 --nocapture
    - name: QuickJS parser bytecode and semantic differential
      run: |
        git init "$RUNNER_TEMP/quickjs-parser-source"
        git -C "$RUNNER_TEMP/quickjs-parser-source" remote add origin https://github.com/quickjs-ng/quickjs.git
        git -C "$RUNNER_TEMP/quickjs-parser-source" fetch --depth 1 origin 3c9afc9943323ee9c7dbd123c0cd991448f4b6c2
        python3 scripts/quickjs_parser_continuations_gate.py --quickjs "$RUNNER_TEMP/quickjs-parser-source" --out "$RUNNER_TEMP/quickjs-parser-proof"
    - name: Preserve paired parser proof
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quickjs-parser-proof
        path: |
          ${{ runner.temp }}/quickjs-parser-proof/result.json
          ${{ runner.temp }}/quickjs-parser-proof/*-build.log
          ${{ runner.temp }}/quickjs-parser-proof/fixtures
    - name: Actual Web viewport bounds and tiny toolbar rendering
      run: |
        rustc --edition=2021 -O -C overflow-checks=on --test tests/web_viewport.rs -o "$RUNNER_TEMP/web-viewport"
        "$RUNNER_TEMP/web-viewport"
        cargo test --locked -p sex-web --test viewport
    - name: Intel Wi-Fi driver core (crypto vectors, handshakes, firmware files, power-up)
      run: bash scripts/wifi_host_gate.sh
    - name: Cufflinks Bluetooth host stack (HCI goldens, SMP vectors, Intel firmware load, pairing)
      run: bash scripts/bt_host_gate.sh
    - name: Batik layered image editor engine (12 blend modes, brush, adjustments, PSD, ORA) on the host
      run: bash scripts/batik_host_gate.sh
    - name: Power off and restart through ACPI (host half)
      run: bash scripts/power_host_gate.sh
    - name: Drag VM ABI layouts and VMX/EPT encodings (host half), Crossdress cell on KVM when the runner has it
      run: |
        if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm || true; fi
        bash scripts/drag_host_gate.sh
    - name: Laptop power model (embedded controller, battery, backlight, thermal, _CRS)
      run: cargo test --locked -p sex-laptop
    - name: Touchpad model (I2C HID, report descriptors, contacts, gestures)
      run: cargo test --locked -p sex-hid-touch
    - name: DesignWare I2C bus (simulated controller)
      run: cargo test --locked -p sex-i2c-dw

  truth:
    name: Host kernel-model regressions (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
      with:
        qemu: "false"
    - name: Host kernel-model regressions
      run: python3 scripts/check_architectural_truth.py --run-host --shard ${{ matrix.shard }}/3 --evidence-dir "$RUNNER_TEMP/sexos-truth"
    - name: Preserve evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sexos-truth-${{ matrix.shard }}
        path: ${{ runner.temp }}/sexos-truth
        if-no-files-found: ignore

  image:
    name: Build and boot the image once (mandatory entrypoint)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
      with:
        save-cache: "true"
    - name: Build and boot via single entrypoint (mandatory)
      run: GATE_DIR="$RUNNER_TEMP/sexos-runtime" bash scripts/master_runtime_gate.sh --probe 60 --keep-log
    - name: Pack the image for the gate jobs
      run: |
        mkdir -p "$RUNNER_TEMP/sexos-image"
        bash scripts/ci_image_pack.sh "$RUNNER_TEMP/sexos-image/image.tar.zst"
        tar -I 'zstd -T0 -3' -cf "$RUNNER_TEMP/sexos-image/runtime.tar.zst" -C "$RUNNER_TEMP/sexos-runtime" .
    - uses: actions/upload-artifact@v4
      with:
        name: sexos-image
        path: ${{ runner.temp }}/sexos-image
        compression-level: 0
        retention-days: 2
    - name: Preserve the entrypoint gate's evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sexos-entrypoint-proof
        path: ${{ runner.temp }}/sexos-runtime
        if-no-files-found: ignore

  boot:
    name: Boot and runtime gates
    runs-on: ubuntu-latest
    needs: image
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
    - uses: ./.github/actions/image
    # Screenshot gates below (desktop capture and later) read pixels with PIL; it
    # used to arrive with the browser steps that moved to the web job.
    - name: Install image tools for gates
      run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends python3-pil
    - name: Boots to the desktop with 1, 2, 4 and 32 GiB of RAM
      run: python3 scripts/ram_sizes_gate.py --iso sexos-v1.0.0.iso --out "$RUNNER_TEMP/sexos-runtime/ram-sizes"
    - name: Compiled scheduler stack-release boundary
      run: SWITCH_EVIDENCE="$RUNNER_TEMP/sexos-runtime/scheduler-switch.txt" bash scripts/scheduler_switch_boundary_gate.sh
    - name: Timer PKRU save and restore boundary
      run: TIMER_PKRU_EVIDENCE="$RUNNER_TEMP/sexos-runtime/timer-pkru.txt" bash scripts/timer_pkru_return_gate.sh
    - name: Optimized client memory helpers
      run: bash scripts/silk_client_memory_gate.sh target/x86_64-sex/release/kaleidoscope
    - name: Guest park, detached wake and user resume
      run: OWNERSHIP_LOG="$RUNNER_TEMP/sexos-runtime/serial.log" bash scripts/scheduler_ownership_runtime_gate.sh
    - name: Guest immutable memory region authority
      run: MEMORY_AUTHORITY_LOG="$RUNNER_TEMP/sexos-runtime/serial.log" bash scripts/memory_authority_runtime_gate.sh
    - name: Guest sext paging and fault recovery
      run: PAGING_LOG="$RUNNER_TEMP/sexos-runtime/serial.log" bash scripts/paging_recovery_runtime_gate.sh
    - name: Cufflinks (Bluetooth) starts and sleeps without a controller
      run: python3 scripts/cufflinks_idle_gate.py --log "$RUNNER_TEMP/sexos-runtime/serial.log"
    - name: Ordinary Rust and C programs
      run: |
        truncate -s 1G "$RUNNER_TEMP/blank-programs.img"
        python3 scripts/program_std_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$RUNNER_TEMP/sexos-runtime/programs-std"
    - name: Large reads must reach the device
      run: python3 scripts/program_bench_gate.py --large-read --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$RUNNER_TEMP/sexos-runtime/large-read"
    - name: Programs keep their own SSE and AVX registers (XSAVE)
      run: |
        python3 scripts/program_fpu_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$RUNNER_TEMP/sexos-runtime/fpu"
        python3 scripts/program_avx_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$RUNNER_TEMP/sexos-runtime/avx"
    - name: IPC round trip and null call, 1 and 4 cores (bench)
      run: |
        SEXOS_GATE_CPU=max,-pku,+rdseed python3 scripts/program_bench_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$RUNNER_TEMP/sexos-runtime/bench-1"
        SEXOS_GATE_CORES=4 SEXOS_GATE_CPU=max,-pku,+rdseed python3 scripts/program_bench_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$RUNNER_TEMP/sexos-runtime/bench-4"
        grep -ahE '\[bench\] name=(null_syscall|ipc_roundtrip)' "$RUNNER_TEMP"/sexos-runtime/bench-*/* 2>/dev/null || true
    - name: Boot time to the desktop (3 cold boots, #309)
      run: python3 scripts/boot_time_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$RUNNER_TEMP/sexos-runtime/boot-time"
    - name: Big programs start time (#305)
      run: python3 scripts/program_start_gate.py --programs spreadeagle,kaleidoscope,assuit --runs 2 --max-ms 60000 --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$RUNNER_TEMP/sexos-runtime/big-starts"
    - name: IPv6-only network (SLAAC, RDNSS, DHCPv6, sockets, name lookup)
      run: python3 scripts/program_ipv6_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$RUNNER_TEMP/sexos-runtime/ipv6"
    - name: Network time (a clock starting in 2024 comes right by SNTP)
      run: python3 scripts/network_time_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$RUNNER_TEMP/sexos-runtime/network-time"
    - name: ssh program logs in to OpenSSH on the host
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends openssh-server
        sudo usermod -p '*' "$USER"
        python3 scripts/ssh_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$RUNNER_TEMP/sexos-runtime/ssh"
    - name: Swingers downloads a torrent from aria2 on the host
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends aria2
        python3 scripts/swingers_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$RUNNER_TEMP/sexos-runtime/swingers"
    - name: Lurk views a host VNC server and sends it keys
      run: python3 scripts/lurk_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$RUNNER_TEMP/sexos-runtime/lurk"
    - name: Needle prints to a fake IPP Everywhere printer and scans from a fake eSCL scanner
      run: python3 scripts/needle_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$RUNNER_TEMP/sexos-runtime/needle"
    - name: Native screenshot saved as a real PNG file
      run: |
        truncate -s 1G "$RUNNER_TEMP/capture-source.img"
        python3 scripts/desktop_capture_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/capture-source.img" --out "$RUNNER_TEMP/sexos-runtime/capture"
    - name: USB input paths
      run: GATE_DIR="$RUNNER_TEMP/sexos-usb" SKIP_BUILD=1 bash scripts/usb_path_gate.sh
    - name: Kernel cycles on KVM, real CPU (kernel study Phase 0; 1 core with and without PKU, 4 cores)
      run: |
        if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm || true; fi
        if [ ! -w /dev/kvm ]; then echo "[bench.kvm] no usable /dev/kvm on this runner; skipped"; exit 0; fi
        grep -m1 'model name' /proc/cpuinfo; grep -qw pku /proc/cpuinfo && echo "[bench.kvm] host pku=yes" || echo "[bench.kvm] host pku=no"
        out="$RUNNER_TEMP/sexos-runtime/kvm-bench"
        python3 scripts/program_bench_gate.py --accel kvm --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$out/1core-pku"
        python3 scripts/program_bench_gate.py --accel kvm --no-pku --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$out/1core-nopku"
        SEXOS_GATE_CORES=4 python3 scripts/program_bench_gate.py --accel kvm --no-pku --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$out/4core-nopku"
        for f in "$out"/*/bench.json; do echo "$f"; cat "$f"; echo; done
    - name: Preserve runtime evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sexos-runtime-proof
        path: |
          ${{ runner.temp }}/sexos-runtime
          ${{ runner.temp }}/sexos-usb
        if-no-files-found: ignore

  web:
    name: Browser gates
    runs-on: ubuntu-latest
    needs: image
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
    - uses: ./.github/actions/image
    - name: Web page JavaScript (native QuickJS tier)
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends python3-pil
        truncate -s 1G "$RUNNER_TEMP/blank-webjs.img"
        python3 scripts/program_web_js_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-webjs.img" --out "$RUNNER_TEMP/sexos-runtime/web-js"

    - name: Rendezvous draws a vector tile, finds places, draws a route and works offline
      run: python3 scripts/program_rendezvous_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-places.img" --out "$RUNNER_TEMP/sexos-places/rendezvous"

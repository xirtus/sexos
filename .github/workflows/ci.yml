  # Deliberately unsafe fixture-only image; every other job builds normal flags.
  input-payload-proof:
    name: Diagnostic keyboard payload proof (UNSAFE)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
    - name: Build and freeze diagnostic image, then rebuild normal image
      run: bash scripts/build_input_payload_proof.sh "$RUNNER_TEMP/input-payload-proof"
    - name: Strict physical-key oracles on the labeled diagnostic image only
      run: |
        evidence="$RUNNER_TEMP/input-payload-proof"
        runner="$evidence/frozen/source/scripts"
        iso="$evidence/frozen/tested.iso"
        binding="$evidence/frozen/source-binding.json"
        # The GREEN canonical boot formats this disk; preserve its real workspace.
        python3 - "$evidence" "$RUNNER_TEMP/input-proof-seed.img" <<'PYSEED'
        import hashlib, json, sys
        from pathlib import Path
        evidence, seed = map(Path, sys.argv[1:])
        sys.path.insert(0, str(evidence / 'frozen/source/scripts'))
        from https_import_gate import workspace
        source = evidence / 'diagnostic-build/nvme.img'
        data = source.read_bytes()
        manifest = workspace(data)  # Reject missing/corrupt canonical workspace metadata.
        with seed.open('xb') as output:
            output.write(data)
        digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
        if digest(seed) != digest(source):
            raise ValueError('controlled diagnostic seed copy differs')
        seed.chmod(0o444)
        receipt = dict(source=str(source), seed=str(seed), bytes=len(data),
                       source_sha256=digest(source), seed_sha256=digest(seed),
                       iso_sha256=digest(evidence / 'frozen/tested.iso'),
                       boot_serial_sha256=digest(evidence / 'diagnostic-build/serial.log'),
                       boot_report_sha256=digest(evidence / 'diagnostic-build/report.md'),
                       workspace=manifest)
        (evidence / 'controlled-seed.json').write_text(json.dumps(receipt, indent=2) + '\n')
        PYSEED
        python3 "$runner/https_asset_gate.py" --iso "$iso" --binding "$binding" --source-disk "$RUNNER_TEMP/input-proof-seed.img" --out "$evidence/https-asset"
        python3 "$runner/connected_desktop_gate.py" --iso "$iso" --binding "$binding" --source-disk "$RUNNER_TEMP/input-proof-seed.img" --out "$evidence/connected-desktop"
        python3 "$runner/browser_reserve_gate.py" --iso "$iso" --binding "$binding" --source-disk "$RUNNER_TEMP/input-proof-seed.img" --out "$evidence/browser-reserve"
    - name: Preserve labeled diagnostic and normal evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: UNSAFE-keyboard-payload-proof-never-private-input
        path: ${{ runner.temp }}/input-payload-proof
        if-no-files-found: ignore

  # Leak gate (WS2): every program and restartable service gives its memory back.
  leaks:
    name: Leak gate (programs open/close, services restart)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
    - name: Build the image with the crash probe
      run: |
        SEXOS_CRASH_PROBE=1 SEXOS_STOP_RESTART_SECONDS=8 ./scripts/entrypoint_build.sh > "$RUNNER_TEMP/leak-build.log" 2>&1 || (tail -80 "$RUNNER_TEMP/leak-build.log"; exit 1)
    - name: Memory comes back after open/close and restart cycles
      run: |
        truncate -s 1G "$RUNNER_TEMP/leak-source.img"
        python3 scripts/leak_gate.py --services --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/leak-source.img" --out "$RUNNER_TEMP/sexos-leak"
    - name: Leak report
      if: always()
      run: |
        [ -f "$RUNNER_TEMP/sexos-leak/leak.json" ] && python3 -c "import json,sys; r=json.load(open(sys.argv[1])); print('ok', r.get('ok'), 'leaks', r.get('leaks'), 'why', r.get('why')); [print(k, n, v['growth']) for k in ('programs','services') for n, v in r.get(k, {}).items()]" "$RUNNER_TEMP/sexos-leak/leak.json" | tee -a "$GITHUB_STEP_SUMMARY" || true
    - name: Preserve leak evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sexos-leak-proof
        path: |
          ${{ runner.temp }}/sexos-leak/leak.json
          ${{ runner.temp }}/sexos-leak/*.log
        if-no-files-found: ignore

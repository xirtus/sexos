name: Rust CI

# Gates run as parallel jobs. Each job sets up from shared caches (rustup,
# cargo + target, FFmpeg, libc++); jobs that boot SexOS build their own ISO,
# so no job waits on another. Every gate of the former single job still runs.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: Host regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
      with:
        qemu: "false"
    - name: Enforce root allowlist
      run: bash scripts/dev/check_root_allowlist.sh --strict
    - name: Host proof regressions
      run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_*.py'
    - name: Other systems' filesystems (FAT, exFAT, ext4, NTFS) on the host
      run: bash scripts/volumes_host_gate.sh
    - name: IOMMU tables, page tables and lending window on the host
      run: bash scripts/iommu_host_gate.sh
    - name: Display model (KMS, EDID) and Intel Gen12 display engine on the host
      run: bash scripts/kms_host_gate.sh
    - name: sexdrive DMA lifetime and zero-copy reads on the host
      run: bash scripts/sexdrive_dma_host_gate.sh
    - name: Intel RAID (IMSM metadata, VMD bus) on the host
      run: bash scripts/raid_host_gate.sh
    - name: Hardware census table (names, owners, VMD warning) on the host
      run: bash scripts/hwdb_host_gate.sh
    - name: Bell sound rate conversion on the host
      run: bash scripts/sound_host_gate.sh
    - name: Explicit program heap limits with actual Talc
      run: bash scripts/program_heap_limit_host_gate.sh
    - name: Unarmed recorder custody and restart contracts
      run: bash scripts/desktop_recording_host_gate.sh
    - name: Native screenshot custody and PNG output on the host
      run: bash scripts/desktop_capture_host_gate.sh
    - name: HTML containing-block and replaced sizing
      run: cargo test --locked -p sex-html
    - name: Signed package format and store catalog
      run: cargo test --locked -p sex-pkg
    - name: Disk layouts (GPT, FAT, install beside other systems)
      run: cargo test --locked -p sex-disk --lib
    - name: Keyboard layouts, dead keys and Compose
      run: cargo test --locked -p sex-keymap
    - name: Fallback fonts reach Cyrillic, Greek, CJK, emoji and symbols
      run: cargo test --locked -p sex-font --test fallback
    - name: Shaping (rustybuzz vs hb-shape), Arabic joining and bidi
      run: cargo test --locked -p sex-shape --features shaping
    - name: Pinyin input method
      run: cargo test --locked -p sex-ime
    - name: SexOS filesystem check and repair (injected faults)
      run: cargo test --locked --release -p sexfs --features repair --lib
    - name: Network stack (IPv6 resolvers, accept backlog, UDP queues) on the host
      run: cargo test --locked -p sex-net --lib
    - name: HTTP/2 client (HPACK, 50 streams) against a real h2 server, plain and over TLS
      run: |
        python3 -m pip install --quiet --user --break-system-packages h2==4.4.1
        SEXOS_REQUIRE_H2=1 cargo test --locked -p sex-http --lib h2
        SEXOS_REQUIRE_H2=1 cargo test --locked -p sex-tls --features open-web --lib alpn
    - name: WireGuard protocol (Python peer interop) and SSH client (real OpenSSH) on the host
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends openssh-server
        # The runner account is password-locked; without PAM sshd refuses locked accounts even for keys.
        sudo usermod -p '*' "$USER"
        cargo test --locked -p sex-wg
        cargo test --locked -p sex-ssh
    - name: Crash record format host regressions
      run: bash scripts/crash_log_host_gate.sh
    - name: Experimental JS baseline JIT differential and emitted-code gates
      run: |
        SEXJS_NATIVE=0 cargo test --release -p sex-js --features baseline-jit -- --test-threads=1 --nocapture
        SEXJS_NATIVE=1 cargo test --release -p sex-js --features baseline-jit -- --test-threads=1 --nocapture
    - name: QuickJS parser bytecode and semantic differential
      run: |
        git init "$RUNNER_TEMP/quickjs-parser-source"
        git -C "$RUNNER_TEMP/quickjs-parser-source" remote add origin https://github.com/quickjs-ng/quickjs.git
        git -C "$RUNNER_TEMP/quickjs-parser-source" fetch --depth 1 origin 3c9afc9943323ee9c7dbd123c0cd991448f4b6c2
        python3 scripts/quickjs_parser_continuations_gate.py --quickjs "$RUNNER_TEMP/quickjs-parser-source" --out "$RUNNER_TEMP/quickjs-parser-proof"
    - name: Preserve paired parser proof
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quickjs-parser-proof
        path: |
          ${{ runner.temp }}/quickjs-parser-proof/result.json
          ${{ runner.temp }}/quickjs-parser-proof/*-build.log
          ${{ runner.temp }}/quickjs-parser-proof/fixtures
    - name: Actual Web viewport bounds and tiny toolbar rendering
      run: |
        rustc --edition=2021 -O -C overflow-checks=on --test tests/web_viewport.rs -o "$RUNNER_TEMP/web-viewport"
        "$RUNNER_TEMP/web-viewport"
        cargo test --locked -p sex-web --test viewport
    - name: Intel Wi-Fi driver core (crypto vectors, handshakes, firmware files, power-up)
      run: bash scripts/wifi_host_gate.sh
    - name: Power off and restart through ACPI (host half)
      run: bash scripts/power_host_gate.sh

  truth:
    name: Host kernel-model regressions (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
      with:
        qemu: "false"
    - name: Host kernel-model regressions
      run: python3 scripts/check_architectural_truth.py --run-host --shard ${{ matrix.shard }}/3 --evidence-dir "$RUNNER_TEMP/sexos-truth"
    - name: Preserve evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sexos-truth-${{ matrix.shard }}
        path: ${{ runner.temp }}/sexos-truth
        if-no-files-found: ignore

  boot:
    name: Build, boot and runtime gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
      with:
        save-cache: "true"
    - name: Build and boot via single entrypoint (mandatory)
      run: GATE_DIR="$RUNNER_TEMP/sexos-runtime" bash scripts/master_runtime_gate.sh --probe 60 --keep-log
    - name: Boots to the desktop with 1, 2, 4 and 32 GiB of RAM
      run: python3 scripts/ram_sizes_gate.py --iso sexos-v1.0.0.iso --out "$RUNNER_TEMP/sexos-runtime/ram-sizes"
    - name: Compiled scheduler stack-release boundary
      run: SWITCH_EVIDENCE="$RUNNER_TEMP/sexos-runtime/scheduler-switch.txt" bash scripts/scheduler_switch_boundary_gate.sh
    - name: Timer PKRU save and restore boundary
      run: TIMER_PKRU_EVIDENCE="$RUNNER_TEMP/sexos-runtime/timer-pkru.txt" bash scripts/timer_pkru_return_gate.sh
    - name: Optimized client memory helpers
      run: bash scripts/silk_client_memory_gate.sh target/x86_64-sex/release/kaleidoscope
    - name: Guest park, detached wake and user resume
      run: OWNERSHIP_LOG="$RUNNER_TEMP/sexos-runtime/serial.log" bash scripts/scheduler_ownership_runtime_gate.sh
    - name: Guest immutable memory region authority
      run: MEMORY_AUTHORITY_LOG="$RUNNER_TEMP/sexos-runtime/serial.log" bash scripts/memory_authority_runtime_gate.sh
    - name: Guest sext paging and fault recovery
      run: PAGING_LOG="$RUNNER_TEMP/sexos-runtime/serial.log" bash scripts/paging_recovery_runtime_gate.sh
    - name: Ordinary Rust and C programs
      run: |
        truncate -s 1G "$RUNNER_TEMP/blank-programs.img"
        python3 scripts/program_std_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$RUNNER_TEMP/sexos-runtime/programs-std"
    - name: Lua 5.4 interpreter
      run: python3 scripts/lua_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$RUNNER_TEMP/sexos-runtime/lua"
    - name: Signed packages, install service and first-run grant question
      run: |
        truncate -s 1G "$RUNNER_TEMP/blank-packages.img"
        python3 scripts/package_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-packages.img" --out "$RUNNER_TEMP/sexos-runtime/packages"
    - name: ripgrep and fd
      run: python3 scripts/rg_fd_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$RUNNER_TEMP/sexos-runtime/rg-fd"
    - name: Python 3.13 interpreter (CPython)
      run: python3 scripts/python_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$RUNNER_TEMP/sexos-runtime/python"
    - name: Store program and the +pkg run grant
      run: |
        truncate -s 1G "$RUNNER_TEMP/blank-store.img"
        python3 scripts/store_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-store.img" --out "$RUNNER_TEMP/sexos-runtime/store"
    - name: Large reads must reach the device
      run: python3 scripts/program_bench_gate.py --large-read --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$RUNNER_TEMP/sexos-runtime/large-read"
    - name: IPv6-only network (SLAAC, RDNSS, DHCPv6, sockets, name lookup)
      run: python3 scripts/program_ipv6_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$RUNNER_TEMP/sexos-runtime/ipv6"
    - name: ssh program logs in to OpenSSH on the host
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends openssh-server
        sudo usermod -p '*' "$USER"
        python3 scripts/ssh_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-programs.img" --out "$RUNNER_TEMP/sexos-runtime/ssh"
    - name: Web page JavaScript (native QuickJS tier)
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends python3-pil
        truncate -s 1G "$RUNNER_TEMP/blank-webjs.img"
        python3 scripts/program_web_js_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-webjs.img" --out "$RUNNER_TEMP/sexos-runtime/web-js"
    - name: Actual Web maximize and restore with full viewport pixels
      run: python3 scripts/program_web_viewport_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-webjs.img" --out "$RUNNER_TEMP/sexos-runtime/web-viewport"
    - name: Classic script resources and fetch CORS isolation
      run: |
        truncate -s 1G "$RUNNER_TEMP/blank-classic.img"
        python3 scripts/program_web_classic_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-classic.img" --out "$RUNNER_TEMP/sexos-runtime/web-classic"
    - name: Native Promise rejection events and source isolation
      run: |
        truncate -s 1G "$RUNNER_TEMP/blank-promise.img"
        python3 scripts/program_web_promise_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-promise.img" --out "$RUNNER_TEMP/sexos-runtime/web-promise"
    - name: Browser tabs, history, bookmarks, lasting storage, find and zoom across a reboot
      run: |
        truncate -s 1G "$RUNNER_TEMP/blank-daily.img"
        python3 scripts/program_web_daily_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-daily.img" --out "$RUNNER_TEMP/sexos-runtime/web-daily"
    - name: Browser WebSocket echo (text, binary, 70 KB, ping, clean close)
      run: python3 scripts/program_web_websocket_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-daily.img" --out "$RUNNER_TEMP/sexos-runtime/web-websocket"
    - name: Browser downloads (20 MB to Files, hash read back from disk)
      run: python3 scripts/program_web_download_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-daily.img" --out "$RUNNER_TEMP/sexos-runtime/web-download"
    - name: Browser forms (GET, urlencoded and multipart POST)
      run: python3 scripts/program_web_form_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-daily.img" --out "$RUNNER_TEMP/sexos-runtime/web-form"
    - name: Browser site suite (encyclopedia, news, links, GitHub, webmail sign-in)
      run: python3 scripts/browser_sites_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-daily.img" --out "$RUNNER_TEMP/sexos-runtime/web-sites"
    - name: Native screenshot saved as a real PNG file
      run: |
        truncate -s 1G "$RUNNER_TEMP/capture-source.img"
        python3 scripts/desktop_capture_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/capture-source.img" --out "$RUNNER_TEMP/sexos-runtime/capture"
    - name: Alt+Tab window switcher with live thumbnails
      run: |
        truncate -s 256M "$RUNNER_TEMP/switcher-source.img"
        python3 scripts/window_switcher_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/switcher-source.img" --out "$RUNNER_TEMP/sexos-runtime/switcher"
    - name: Clipboard history on Super+V
      run: |
        truncate -s 256M "$RUNNER_TEMP/cliphist-source.img"
        python3 scripts/clipboard_history_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/cliphist-source.img" --out "$RUNNER_TEMP/sexos-runtime/clipboard-history"
    - name: Screenshot UI on Print
      run: |
        truncate -s 256M "$RUNNER_TEMP/screenshot-source.img"
        python3 scripts/screenshot_ui_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/screenshot-source.img" --out "$RUNNER_TEMP/sexos-runtime/screenshot-ui"
    - name: Panel tray and calendar
      run: |
        truncate -s 256M "$RUNNER_TEMP/tray-source.img"
        python3 scripts/tray_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/tray-source.img" --out "$RUNNER_TEMP/sexos-runtime/tray"
    - name: USB input paths
      run: GATE_DIR="$RUNNER_TEMP/sexos-usb" SKIP_BUILD=1 bash scripts/usb_path_gate.sh
    - name: Preserve runtime evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sexos-runtime-proof
        path: |
          ${{ runner.temp }}/sexos-runtime
          ${{ runner.temp }}/sexos-usb
        if-no-files-found: ignore

  devices:
    name: Disks, power and fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
    - name: Build the image
      run: ./scripts/entrypoint_build.sh > "$RUNNER_TEMP/build.log" 2>&1 || (tail -80 "$RUNNER_TEMP/build.log"; exit 1)
    - name: USB sticks in Files
      run: |
        truncate -s 256M "$RUNNER_TEMP/blank-usb.img"
        python3 scripts/usb_storage_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-usb.img" --out "$RUNNER_TEMP/sexos-usb-storage"
    - name: Files background copy, cancel, trash and delete for good
      run: python3 scripts/files_jobs_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-usb.img" --out "$RUNNER_TEMP/sexos-files-jobs"
    - name: Files safe eject and pulled-out sticks
      run: python3 scripts/files_eject_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-usb.img" --out "$RUNNER_TEMP/sexos-files-eject"
    - name: Files thumbnails for a folder of 50 pictures, cached
      run: python3 scripts/files_thumbs_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-usb.img" --out "$RUNNER_TEMP/sexos-files-thumbs"
    - name: ext4 stick written from SexOS, e2fsck clean
      run: python3 scripts/files_ext4_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-usb.img" --out "$RUNNER_TEMP/sexos-files-ext4"
    - name: Power cuts while Files writes (QEMU killed, disk checked each time)
      run: python3 scripts/powercut_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-usb.img" --out "$RUNNER_TEMP/sexos-powercut"
    - name: Files repairs a damaged disk at start
      run: python3 scripts/sexfs_repair_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-usb.img" --out "$RUNNER_TEMP/sexos-fs-repair"
    - name: USB network adapter
      run: python3 scripts/usb_net_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-usb.img" --out "$RUNNER_TEMP/sexos-usb-net"
    - name: Intel RAID 0 on two NVMe drives, read only
      run: python3 scripts/raid_gate.py --out "$RUNNER_TEMP/sexos-raid"
    - name: Power off and restart through ACPI
      run: python3 scripts/power_acpi_gate.py --iso sexos-v1.0.0.iso --out "$RUNNER_TEMP/sexos-power"
    - name: Discrete GPU powered off through ACPI
      run: python3 scripts/dgpu_power_gate.py --iso sexos-v1.0.0.iso --out "$RUNNER_TEMP/sexos-dgpu"
    - name: Display drives a virtio-gpu (EDID, takeover, tear-free flips)
      run: python3 scripts/virtio_gpu_gate.py --iso sexos-v1.0.0.iso --out "$RUNNER_TEMP/sexos-virtio-gpu"
    - name: Reboot persistence and rendering
      run: GATE_DIR="$RUNNER_TEMP/sexos-persistence" SKIP_BUILD=1 bash scripts/disk_persistence_gate.sh
    - name: Syscall and IPC fuzzing
      run: |
        truncate -s 1G "$RUNNER_TEMP/fuzz-source.img"
        python3 scripts/syscall_fuzz_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/fuzz-source.img" --out "$RUNNER_TEMP/sexos-fuzz"
    - name: Preserve evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sexos-devices-proof
        path: |
          ${{ runner.temp }}/sexos-files-jobs/*.ppm
          ${{ runner.temp }}/sexos-files-jobs/*.log
          ${{ runner.temp }}/sexos-files-eject/*.ppm
          ${{ runner.temp }}/sexos-files-eject/*.log
          ${{ runner.temp }}/sexos-fs-repair/*.log
          ${{ runner.temp }}/sexos-raid
          ${{ runner.temp }}/sexos-power
          ${{ runner.temp }}/sexos-dgpu
          ${{ runner.temp }}/sexos-persistence
          ${{ runner.temp }}/sexos-fuzz
        if-no-files-found: ignore

  media:
    name: Browser media streaming and seeking
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
    - name: Prepare media host checks
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
        bash scripts/media_source_host_gate.sh
    - name: Build the FFmpeg-enabled image
      run: ./scripts/entrypoint_build.sh > "$RUNNER_TEMP/media-build.log" 2>&1 || (tail -80 "$RUNNER_TEMP/media-build.log"; exit 1)
    - name: Progressive playback and Range seek
      run: |
        truncate -s 1G "$RUNNER_TEMP/media-source.img"
        python3 scripts/program_web_stream_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/media-source.img" --out "$RUNNER_TEMP/sexos-web-stream"
        python3 scripts/program_web_seek_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/media-source.img" --out "$RUNNER_TEMP/sexos-web-seek"
    - name: Preserve media evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sexos-media-proof
        path: |
          ${{ runner.temp }}/media-build.log
          ${{ runner.temp }}/sexos-web-stream
          ${{ runner.temp }}/sexos-web-seek
        if-no-files-found: ignore

  profiles:
    name: Proof builds (${{ matrix.gate }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        gate: [cleanup, app-resource, crash]
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
    - name: Task finish and quota cleanup with surviving client
      if: matrix.gate == 'cleanup'
      run: GATE_DIR="$RUNNER_TEMP/sexos-proof" bash scripts/paging_cleanup_profiles_gate.sh
    - name: App resource retirement and normal desktop close
      if: matrix.gate == 'app-resource'
      run: GATE_DIR="$RUNNER_TEMP/sexos-proof" bash scripts/app_resource_profiles_gate.sh
    - name: Boot log, stop screen, crash records and service restarts (probe build)
      if: matrix.gate == 'crash'
      run: |
        SEXOS_CRASH_PROBE=1 SEXOS_STOP_RESTART_SECONDS=8 ./scripts/entrypoint_build.sh > "$RUNNER_TEMP/crash-probe-build.log" 2>&1 || (tail -50 "$RUNNER_TEMP/crash-probe-build.log"; exit 1)
        truncate -s 1G "$RUNNER_TEMP/crash-source.img"
        python3 scripts/crash_screen_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/crash-source.img" --out "$RUNNER_TEMP/sexos-proof"
    - name: Cap-scoped peer epochs across same-task service restart
      if: matrix.gate == 'crash'
      run: SEXOS_GATE_CORES=4 python3 scripts/service_peer_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/crash-source.img" --out "$RUNNER_TEMP/sexos-proof/service-peer"
    - name: Preserve evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sexos-proof-${{ matrix.gate }}
        path: ${{ runner.temp }}/sexos-proof
        if-no-files-found: ignore

  # Single required check: keeps the old "build" check name for branch rules.
  build:
    if: always()
    needs: [host, truth, boot, devices, media, profiles, js-jit, recording]
    runs-on: ubuntu-latest
    steps:
    - run: |
        echo '${{ toJSON(needs) }}' | python3 -c "import json,sys; r={k:v['result'] for k,v in json.load(sys.stdin).items()}; print(r); sys.exit(any(v!='success' for v in r.values()))"

  js-jit:
    name: Experimental JS JIT and W^X (${{ matrix.cores }} cores)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        cores: [1, 4]
    env:
      SEXOS_GATE_CORES: ${{ matrix.cores }}
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
    - name: Build sealed ISO from this candidate
      run: ./scripts/entrypoint_build.sh > "$RUNNER_TEMP/build.log" 2>&1 || (tail -80 "$RUNNER_TEMP/build.log"; exit 1)
    - name: Runtime code permissions, blocked instructions and per-run fault isolation
      run: |
        truncate -s 1G "$RUNNER_TEMP/blank-jit.img"
        python3 scripts/program_jit_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-jit.img" --out "$RUNNER_TEMP/js-jit/kernel-code"
    - name: Browser hot bytecode compared to forced interpreter
      run: |
        bash scripts/build_web_jit.sh "$RUNNER_TEMP/web-jit"
        python3 scripts/program_web_jit_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-jit.img" --program "$RUNNER_TEMP/web-jit" --out "$RUNNER_TEMP/js-jit/browser"
    - name: Retain exact boot media with the opt-in program (one core)
      if: always() && matrix.cores == 1
      run: |
        if [ -f sexos-v1.0.0.iso ]; then
          mkdir -p "$RUNNER_TEMP/js-jit"
          cp sexos-v1.0.0.iso "$RUNNER_TEMP/js-jit/candidate.iso"
          sha256sum sexos-v1.0.0.iso > "$RUNNER_TEMP/js-jit/inputs.sha256"
          if [ -f "$RUNNER_TEMP/web-jit" ]; then sha256sum "$RUNNER_TEMP/web-jit" >> "$RUNNER_TEMP/js-jit/inputs.sha256"; fi
        fi
    - name: Preserve candidate and evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sexos-js-jit-${{ matrix.cores }}cores
        path: |
          ${{ runner.temp }}/js-jit
          ${{ runner.temp }}/build.log
          ${{ runner.temp }}/web-jit
        if-no-files-found: ignore

  recording:
    name: Lossless encoder guest proof
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
      with:
        recording: "true"
    - name: Independent decoder
      run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
    - name: Build recording-profile candidate
      run: ./scripts/entrypoint_build.sh > "$RUNNER_TEMP/recording-build.log" 2>&1 || (tail -80 "$RUNNER_TEMP/recording-build.log"; exit 1)
    - name: Output ownership and actual guest encoder
      run: |
        rustc --edition=2021 --test tests/recording_output.rs -o "$RUNNER_TEMP/recording-output"
        "$RUNNER_TEMP/recording-output"
        bash scripts/recording_callbacks_host_gate.sh
        rustc --edition=2021 -O -A dead_code -A unused_attributes scripts/sexfs_extract.rs -o "$RUNNER_TEMP/sexfs-extract"
        truncate -s 1G "$RUNNER_TEMP/recording-source.img"
        python3 scripts/recording_guest_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/recording-source.img" --extractor "$RUNNER_TEMP/sexfs-extract" --out "$RUNNER_TEMP/recording"
    - name: Preserve encoder evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sexos-lossless-encoder
        path: |
          ${{ runner.temp }}/recording
          ${{ runner.temp }}/recording-build.log
        if-no-files-found: ignore

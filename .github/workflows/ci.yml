        python3 scripts/drag_drop_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/dnd-source.img" --out "$RUNNER_TEMP/sexos-desktop/dnd"
    - name: Copy and paste between programs, Shift- and Alt-click
      run: |
        truncate -s 256M "$RUNNER_TEMP/clip-source.img"
        python3 scripts/program_clipboard_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/clip-source.img" --out "$RUNNER_TEMP/sexos-desktop/clip"

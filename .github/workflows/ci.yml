        python3 scripts/tray_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/tray-source.img" --out "$RUNNER_TEMP/sexos-desktop/tray"
    - name: Bluetooth panel
      run: |
        truncate -s 256M "$RUNNER_TEMP/bt-panel-source.img"
        python3 scripts/bt_panel_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/bt-panel-source.img" --out "$RUNNER_TEMP/sexos-desktop/bt-panel"
    - name: Window animations
      run: |
        truncate -s 256M "$RUNNER_TEMP/motion-source.img"
        python3 scripts/window_motion_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/motion-source.img" --out "$RUNNER_TEMP/sexos-desktop/motion"
    - name: Programs starting programs
      run: |
        truncate -s 256M "$RUNNER_TEMP/launch-source.img"

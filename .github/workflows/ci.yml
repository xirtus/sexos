    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
    - uses: ./.github/actions/image
    - name: USB sticks in Files
      run: |
        truncate -s 256M "$RUNNER_TEMP/blank-usb.img"

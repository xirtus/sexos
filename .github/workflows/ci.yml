  build:
    if: always()
    needs: [host, truth, boot, desktop, devices, programs, media, editor, profiles, js-jit, recording, productivity, terminal-editor, documents-pictures, reading, places]
    runs-on: ubuntu-latest
    steps:
    - run: |
        echo '${{ toJSON(needs) }}' | python3 -c "import json,sys; r={k:v['result'] for k,v in json.load(sys.stdin).items()}; print(r); sys.exit(any(v!='success' for v in r.values()))"

  js-jit:
    name: Experimental JS JIT and W^X (${{ matrix.cores }} cores)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        cores: [1, 4]
    env:
      SEXOS_GATE_CORES: ${{ matrix.cores }}
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
    - name: Build sealed ISO from this candidate
      run: ./scripts/entrypoint_build.sh > "$RUNNER_TEMP/build.log" 2>&1 || (tail -80 "$RUNNER_TEMP/build.log"; exit 1)
    - name: Runtime code permissions, blocked instructions and per-run fault isolation
      run: |
        truncate -s 1G "$RUNNER_TEMP/blank-jit.img"
        python3 scripts/program_jit_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-jit.img" --out "$RUNNER_TEMP/js-jit/kernel-code"
    - name: Browser hot bytecode compared to forced interpreter
      run: |
        bash scripts/build_web_jit.sh "$RUNNER_TEMP/web-jit"
        python3 scripts/program_web_jit_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-jit.img" --program "$RUNNER_TEMP/web-jit" --out "$RUNNER_TEMP/js-jit/browser"
    - name: Retain exact boot media with the opt-in program (one core)
      if: always() && matrix.cores == 1
      run: |
        if [ -f sexos-v1.0.0.iso ]; then
          mkdir -p "$RUNNER_TEMP/js-jit"
          cp sexos-v1.0.0.iso "$RUNNER_TEMP/js-jit/candidate.iso"
          sha256sum sexos-v1.0.0.iso > "$RUNNER_TEMP/js-jit/inputs.sha256"
          if [ -f "$RUNNER_TEMP/web-jit" ]; then sha256sum "$RUNNER_TEMP/web-jit" >> "$RUNNER_TEMP/js-jit/inputs.sha256"; fi
        fi
    - name: Preserve candidate and evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sexos-js-jit-${{ matrix.cores }}cores
        path: |
          ${{ runner.temp }}/js-jit
          ${{ runner.temp }}/build.log
          ${{ runner.temp }}/web-jit
        if-no-files-found: ignore

  recording:
    name: Lossless encoder guest proof
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
      with:
        recording: "true"
    - name: Independent decoder
      run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
    - name: Build recording-profile candidate
      run: ./scripts/entrypoint_build.sh > "$RUNNER_TEMP/recording-build.log" 2>&1 || (tail -80 "$RUNNER_TEMP/recording-build.log"; exit 1)
    - name: Output ownership and actual guest encoder
      run: |
        rustc --edition=2021 --test tests/recording_output.rs -o "$RUNNER_TEMP/recording-output"
        "$RUNNER_TEMP/recording-output"
        bash scripts/recording_callbacks_host_gate.sh
        rustc --edition=2021 -O -A dead_code -A unused_attributes scripts/sexfs_extract.rs -o "$RUNNER_TEMP/sexfs-extract"
        truncate -s 1G "$RUNNER_TEMP/recording-source.img"
        python3 scripts/recording_guest_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/recording-source.img" --extractor "$RUNNER_TEMP/sexfs-extract" --out "$RUNNER_TEMP/recording"
    - name: Flash UVC camera photo and Splicy WebM video guest proof
      run: |
        truncate -s 1G "$RUNNER_TEMP/flash-source.img"
        python3 scripts/flash_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/flash-source.img" --require-video --out "$RUNNER_TEMP/recording/flash"
    - name: Preserve encoder evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sexos-lossless-encoder
        path: |
          ${{ runner.temp }}/recording
          ${{ runner.temp }}/recording-build.log
        if-no-files-found: ignore

  productivity:
    name: Productivity programs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
    - name: Calculator arithmetic and calendar model on the host
      run: cargo test --locked -p sex-calc-core -p sex-calendar -p sex-dav -p sex-vcard -p sex-vt -p sex-textedit -p sex-wasm && cargo test --locked -p sex-pdx --test stream --test console_relay
    - name: Build the image
      run: ./scripts/entrypoint_build.sh > "$RUNNER_TEMP/productivity-build.log" 2>&1 || (tail -80 "$RUNNER_TEMP/productivity-build.log"; exit 1)
    - name: Calculator typed, clicked and recalled
      run: |
        truncate -s 256M "$RUNNER_TEMP/blank-productivity.img"
        python3 scripts/program_calc_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-productivity.img" --out "$RUNNER_TEMP/sexos-productivity/calc"
    - name: Calendar imports .ics, shows repeats on their days and keeps events
      run: python3 scripts/program_calendar_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-productivity.img" --out "$RUNNER_TEMP/sexos-productivity/calendar"
    - name: Date syncs both ways with a CalDAV server, answers an invitation and rings a timer and a reminder
      run: python3 scripts/program_date_caldav_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-productivity.img" --out "$RUNNER_TEMP/sexos-productivity/date"
    - name: Crush imports vCards, edits, searches and syncs both ways with a CardDAV server
      run: python3 scripts/program_crush_carddav_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-productivity.img" --out "$RUNNER_TEMP/sexos-productivity/crush"
    - name: Batik and Burlesque creative apps
      run: |
        python3 scripts/batik_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-productivity.img" --out "$RUNNER_TEMP/sexos-productivity/batik"
        python3 scripts/burlesque_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-productivity.img" --out "$RUNNER_TEMP/sexos-productivity/burlesque"
    - name: Preserve productivity evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sexos-productivity-proof
        path: |
          ${{ runner.temp }}/productivity-build.log
          ${{ runner.temp }}/sexos-productivity
        if-no-files-found: ignore

  terminal-editor:
    name: Terminal and editor
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
    - name: Build the image
      run: ./scripts/entrypoint_build.sh > "$RUNNER_TEMP/term-build.log" 2>&1 || (tail -80 "$RUNNER_TEMP/term-build.log"; exit 1)
    - name: Term draws the VT fixture, runs a Wasm program behind a stream; std consoles become terminals
      run: |
        truncate -s 256M "$RUNNER_TEMP/blank-term.img"
        python3 scripts/program_term_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-term.img" --out "$RUNNER_TEMP/sexos-term/term"
    - name: Programs of their own (std, C) run inside Term with it as their console
      run: python3 scripts/program_term_native_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-term.img" --out "$RUNNER_TEMP/sexos-term/term-native"
    - name: Jot undo tree, save and reopen, find and replace, spelling, tabs
      run: python3 scripts/program_jot_edit_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-term.img" --out "$RUNNER_TEMP/sexos-term/jot-edit"
    - name: Jot as a notepad in its own folder (original gate)
      run: python3 scripts/program_jot_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-term.img" --out "$RUNNER_TEMP/sexos-term/jot"
    - name: Jot brings unsaved work back after a crash, keeps CRLF, previews Markdown, wraps
      run: python3 scripts/program_jot_restore_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-term.img" --out "$RUNNER_TEMP/sexos-term/jot-restore"
    - name: Preserve terminal and editor evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sexos-terminal-editor-proof
        path: |
          ${{ runner.temp }}/term-build.log
          ${{ runner.temp }}/sexos-term
        if-no-files-found: ignore

  documents-pictures:
    name: Documents and pictures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
    - name: Build the image
      run: ./scripts/entrypoint_build.sh > "$RUNNER_TEMP/productivity-build.log" 2>&1 || (tail -80 "$RUNNER_TEMP/productivity-build.log"; exit 1)
    - name: PDF finds a word on page 7, outline, thumbnails and zoom
      run: |
        truncate -s 256M "$RUNNER_TEMP/blank-pdf.img"
        python3 scripts/program_pdf_find_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-pdf.img" --out "$RUNNER_TEMP/sexos-productivity/pdf-find"
    - name: View pictures, turns, zoom, animated WebP and a folder slideshow
      run: |
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends python3-pil
        truncate -s 256M "$RUNNER_TEMP/blank-view.img"
        python3 scripts/program_view_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank-view.img" --out "$RUNNER_TEMP/sexos-productivity/view"
    - name: Preserve document and picture evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sexos-documents-proof
        path: |
          ${{ runner.temp }}/productivity-build.log
          ${{ runner.temp }}/sexos-productivity
        if-no-files-found: ignore

    - name: Build the image
      run: ./scripts/entrypoint_build.sh > "$RUNNER_TEMP/desktop-build.log" 2>&1 || (tail -80 "$RUNNER_TEMP/desktop-build.log"; exit 1)
    - name: Settings last across a restart
      run: |

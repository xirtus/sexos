name: Latency diagnosis (temporary, stream 8)

on:
  push:
    branches: [ claude/project-thread-cfxcuc ]

jobs:
  latency:
    name: latency_gate ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 4c-pku,   cores: "4", cpu: "max,+pku,+rdseed" }
          - { name: 3c-pku,   cores: "3", cpu: "max,+pku,+rdseed" }
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/setup
    - name: Build the image
      run: ./scripts/entrypoint_build.sh > "$RUNNER_TEMP/build.log" 2>&1 || (tail -80 "$RUNNER_TEMP/build.log"; exit 1)
    - name: Latency gate x3
      env:
        SEXOS_GATE_CORES: ${{ matrix.cores }}
        SEXOS_GATE_CPU: ${{ matrix.cpu }}
      run: |
        nproc; truncate -s 1G "$RUNNER_TEMP/blank.img"
        for i in 1 2 3; do
          echo "=== run $i ==="
          python3 scripts/latency_gate.py --iso sexos-v1.0.0.iso --source-disk "$RUNNER_TEMP/blank.img" --out "$RUNNER_TEMP/lat/run$i" && echo "RUN $i PASS" || { echo "RUN $i FAIL"; python3 scripts/latency_diag_dump.py "$RUNNER_TEMP/lat/run$i/latency-serial.log"; }
          rm -f "$RUNNER_TEMP/lat/run$i/nvme.img"
        done
    - name: Preserve serial logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: latency-${{ matrix.name }}
        path: ${{ runner.temp }}/lat
        if-no-files-found: ignore

[package]
name = "sexos-release"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Makes and signs SexOS release indexes for `update`"

# A host tool: kept out of the SexOS workspace.
[workspace]

[dependencies]
sex-disk = { path = "../../crates/sex-disk" }
ed25519-compact = { version = "2.6", default-features = false, features = ["random"] }
sha2 = "0.10"

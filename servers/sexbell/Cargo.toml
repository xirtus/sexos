[package]
name = "sexbell"
version = "0.1.0"
edition = "2021"

[dependencies]
sex-pdx = { path = "../../crates/sex-pdx" }
sex-sof = { path = "../../crates/sex-sof" }
sha2 = { version = "=0.10.9", default-features = false, features = ["force-soft"] }
linked_list_allocator = "0.10.5"
virtio-drivers = { version = "0.13.0", default-features = false, features = ["alloc"] }
zerocopy = { version = "0.8.40", default-features = false }

# fuzz/drivers builds hda.rs against a device model under cfg(device_model).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(device_model)"] }

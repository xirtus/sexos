[package]

name = "sexfiles"
version = "0.1.0"
edition = "2021"

[dependencies]
spin = "0.9.8"
sex-pdx = { path = "../../crates/sex-pdx" }
sex-config = { path = "../../crates/sex-config", features = ["password"] }
sexfs = { path = "../../crates/sexfs", features = ["repair"] }
sex-disk = { path = "../../crates/sex-disk" }
sex-pkg = { path = "../../crates/sex-pkg" }
sex-volumes = { path = "../../crates/sex-volumes" }
sex-crypt = { path = "../../crates/sex-crypt" }
sex-rt = { path = "../../sex-rt" }
sex-object-model = { path = "../../crates/sex-object-model" }

# Same software SHA-256 for build-time helper attestation and runtime snapshot checks.
sha2 = { version = "=0.10.9", default-features = false, features = ["force-soft"] }

zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

[build-dependencies]
sha2 = { version = "=0.10.9", default-features = false, features = ["force-soft"] }

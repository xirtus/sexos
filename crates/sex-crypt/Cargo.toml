[package]
name = "sex-crypt"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "XTS-AES-256 for disk blocks and Argon2id-wrapped keys, for SexOS's encrypted home"

[dependencies]
# RustCrypto, MIT/Apache-2.0, no_std. Built with the software AES (no AES-NI or SSE state
# in a server's context): RUSTFLAGS cfg aes_force_soft where the target needs it.
aes = { version = "=0.8.4", default-features = false }
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["force-soft"] }

[package]
name = "sex-image"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "PNG, JPEG, WebP and GIF decoding for confined SexOS programs"

[dependencies]
# Pure Rust, no_std + alloc, MIT/Apache-2.0/Zlib. Default features pull in
# std and runtime SIMD detection; SexOS programs are scalar soft-float.
zune-core = { version = "0.5", default-features = false }
zune-jpeg = { version = "0.5", default-features = false }
zune-png = { version = "0.5", default-features = false }
# image-webp 0.2.4 (MIT OR Apache-2.0), made no_std in vendor/.
image-webp = { path = "../../vendor/image-webp-0.2.4" }

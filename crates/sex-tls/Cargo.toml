[package]
name = "sex-tls"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
sex-http = { path = "../sex-http" }
embedded-tls = { version = "=0.19.0", path = "../../vendor/embedded-tls-0.19.0", default-features = false }
embedded-io = { version = "=0.7.1", default-features = false }
embedded-io-async = { version = "=0.7.0", default-features = false }
rand_chacha = { version = "=0.3.1", default-features = false }
rand_core = { version = "=0.6.4", default-features = false }
# Feature unification keeps the TLS transcript on the integer backend too.
sha2 = { version = "=0.10.9", default-features = false, features = ["force-soft"] }
sex-trust-config = { path = "../sex-trust-config" }
webpki = { package = "rustls-webpki", version = "=0.103.16", default-features = false }
rustls-pki-types = { version = "=1.14.0", default-features = false }
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa"] }

# Trust and algorithms for the public web. Only the network service enables this.
rsa = { version = "=0.9.8", default-features = false, optional = true, features = ["sha2"] }
p384 = { version = "=0.13.1", default-features = false, features = ["ecdsa"], optional = true }
webpki-roots = { version = "=1.0.4", default-features = false, optional = true }
# The public-web session: rustls's TLS 1.2 and 1.3 state machines on RustCrypto
# primitives and fiat-crypto's X25519 field, all plain integer code.
rustls = { version = "=0.23.46", default-features = false, optional = true, features = ["tls12"] }
aes-gcm = { version = "=0.10.3", default-features = false, optional = true, features = ["aes"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, optional = true }
hmac = { version = "=0.12.1", default-features = false, optional = true }
fiat-crypto = { version = "=0.2.9", default-features = false, optional = true }

[features]
open-web = ["dep:rsa", "dep:p384", "dep:webpki-roots", "dep:rustls", "dep:aes-gcm", "dep:chacha20poly1305", "dep:hmac", "dep:fiat-crypto", "p384/ecdh", "p256/ecdh"]

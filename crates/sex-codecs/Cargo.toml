[package]
name = "sex-codecs"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Fast, fuzzed pure-Rust decoders for WebP, AVIF, HEIC and GIF animation for SexOS"

[dependencies]
sex-image = { path = "../sex-image" }
image-webp = { path = "../../vendor/image-webp-0.2.4" }
heic-rs = { version = "0.1.4", default-features = false, optional = true }
rusty_av1d = { version = "1.3.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"], optional = true }

[features]
default = ["std", "heic", "avif"]
std = []
heic = ["dep:heic-rs"]
avif = ["std", "dep:rusty_av1d"]



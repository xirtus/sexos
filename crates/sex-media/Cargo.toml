[package]
name = "sex-media"
version = "0.1.0"
edition = "2021"
license.workspace = true
build = "build.rs"
description = "Video and sound for SexOS programs: FFmpeg decoding, paced by the sound card's clock"

[dependencies]
sex-pdx = { path = "../sex-pdx" }
sex-libc = { path = "../sex-libc" }
sex-episodes = { path = "../sex-episodes" }

# Programs get the SDK's heap; host tests (tests/live.rs) keep the host's allocator.
[target.'cfg(not(any(target_os = "linux", target_os = "macos", target_os = "windows")))'.dependencies]
sex-app = { path = "../sex-app" }
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
sex-app = { path = "../sex-app", default-features = false }

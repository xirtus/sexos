[package]
name = "moan-gen"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Moan's opt-in ACE-Step 1.5 & Suno Studio 1.1/2.0 generative engine, model-pack manager and 4-tier supervisor"

[features]
default = []
sexos = ["dep:sex-app", "dep:sex-pdx", "dep:sex-http"]

[dependencies]
moan-core = { path = "../moan-core" }
sha2 = { version = "=0.10.9", default-features = false, features = ["force-soft"] }

[target.'cfg(all(target_arch = "x86_64", any(target_os = "none", target_os = "hermit")))'.dependencies]
sex-app = { path = "../sex-app", optional = true }
sex-pdx = { path = "../sex-pdx", optional = true }
sex-http = { path = "../sex-http", optional = true }

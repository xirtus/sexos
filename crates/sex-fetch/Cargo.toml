[package]
name = "sex-fetch"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "HTTP/1.1 for SexOS programs: requests, chunked and gzip replies, cookies (no_std + alloc, no I/O)"

[dependencies]
zune-inflate = { version = "0.2.54", default-features = false, features = ["gzip", "zlib"] }
# Mozilla Public Suffix List (MIT/Apache-2.0, no_std): no cookie for a whole suffix like co.uk.
psl = "2.1.249"

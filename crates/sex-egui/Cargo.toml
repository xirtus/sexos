[package]
name = "sex-egui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "egui on SexOS: a program window's keys, pointer and pixels driving egui, painted by a CPU rasterizer"

[dependencies]
egui = { version = "0.37.0", default-features = false, features = ["default_fonts", "monochrome_emoji_fonts"] }
[target.'cfg(target_os = "hermit")'.dependencies]
sex-std = { path = "../sex-std" }

[dev-dependencies]
egui_demo_lib = { version = "0.37.0", default-features = false }
png = "0.18"
egui_extras = { version = "0.37.0", default-features = false, features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[package]
name = "sex-laptop"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Laptop power model: embedded controller protocol, battery, backlight, thermal and CPU power profiles"

[lib]
path = "src/lib.rs"

[dev-dependencies]
# The vendored interpreter (workspace patch) runs the fixture AML in tests/awcc_aml.rs.
acpi = { version = "6.1.1", default-features = false, features = ["alloc", "aml"] }

[package]
name = "sex-js"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "JavaScript for SexOS web pages: QuickJS-NG in Wasm on wasmi, with a DOM over sex-html"

[dependencies]
# MIT/Apache-2.0, as in sex-wasm: no_std + alloc, libm for float math, loop dispatch.
wasmi = { version = "2.0.0", default-features = false, features = ["validate", "libm", "portable-dispatch"] }
sex-html = { path = "../sex-html" }

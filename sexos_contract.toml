# SexOS ABI Contract (minimal lock file)
# Canonical runtime contract for kernel <-> sex-pdx IPC.

[contract]
name = "sexos-ipc-abi"
version = "1.0.0"
date = "2026-04-28"

[ipc]
transport = "register-only"
legacy_struct_return = false
legacy_r9_path = false

[ipc.pdx_call]
syscall = 0
status_reg = "rax"
value_reg = "rsi"

[ipc.pdx_listen]
syscall = 28
type_id_reg = "rax"
caller_pd_reg = "rsi"
arg0_reg = "rdx"
arg1_reg = "r10"
arg2_reg = "r8"
empty_type_id = 0

[ipc.pdx_reply]
syscall = 29
input = "rdi-exact-target-domain,rsi-value"
output = "rax-zero-enqueued-or-one-failure"
receive = "type1-arg0-value-caller-actual-sending-domain-captured-by-kernel"
backpressure = "single-slot-full-rejects-without-overwriting-existing-reply;caller-retries"
authority_limit = "legacy-target-directed-return-path;sender-provenance-is-authenticated-not-a-return-capability"

[ipc.wait_self]
syscall = 53
selector = "rdi-zero-self-inbox-only"
result = "rax-zero-recheck-input-after-spurious-or-coalesced-wake"
authority = "no-target-domain-no-cross-domain-wake"
wait_condition = "self-message-ring-or-reply-pending-handshake"
fault_wait = "ordinary-message-or-IRQ-wake-cannot-complete-pager-request"

# Reject full register-width aliases before any lookup or side effect.
# This validates identity; it does not supply operation-specific authority.
[ipc.selectors]
capability_slot_min = 1
capability_slot_max = 1024
pdx_call_listen_slot_zero = "explicit-existing-bridge-only"
reply_domain_id = "exact-u64-below-MAX_DOMAINS-then-registry-lookup"
memlend_destination = "obsolete-operation-denied-no-allocation"
validated_syscalls = [0, 28, 29, 43, 50, 51, 54, 55]
invalid_call = "ERR_CAP_INVALID-with-value-zero"
invalid_listen = "empty-all-output-registers-zero"
invalid_reply = 1
invalid_pci_or_memlend = "u64::MAX"

[memory]
genesis = "BOOT_DAG-fixed-zeroed-reservations-and-premapped-views-before-capability-seal"
runtime_authority = "actual-caller-capability-table-Region-or-Pci-bar0-view-only"
runtime_effects = "region-queries-preserve-mappings;sext-authorized-paging-commits-install-preallocated-leaves;no-runtime-kernel-frame-table-VA-allocation-or-capability-minting"
bootstrap_debt = "kernel-reserves-initial-fixed-backing-VA-and-page-tables;sext-selects-and-zeroes-frames-from-boot-granted-pool"
denied_syscalls = [30, 31, 40, 50, 51]
denied_result = "u64::MAX-except-historical-40-returns-zero"
slot_dma_region = 32
slot_frame_region = 33
slot_block_buffer = 17
rights_query_view = 1
rights_read = 2
rights_write = 4
rights_dma_address = 8
ordinary_view_physical_address = "zero"
paired_region_peer = "authenticated-PDX-caller-matches-BOOT_DAG-peer"
runtime_heap = "65536-byte-ELF-owned-domain-arena-idempotent-init-reusable-byte-allocation-no-frame-map-authority"

[memory.region_view]
syscall = 54
input = "rdi-slot,rsi-offset,rdx-length,r10-rights"
output = "rax-status,rsi-VA,rdx-length,r10-PA-or-zero,r8-region-id"
invalid = "rax-u64::MAX-all-other-output-registers-zero"
validation = "full-width-slot-and-rights-before-narrowing-nonempty-checked-subrange"

[memory.region_info]
syscall = 55
input = "rdi-slot"
output = "rax-status,rsi-length,rdx-rights,r10-peer-or-zero,r8-region-id"
invalid = "rax-u64::MAX-all-other-output-registers-zero"

[memory.pci_bar]
syscall = 43
policy = "idempotent-premapped-BOOT_DAG-Pci-BAR0-view-query"
input = "rdi-Pci-cap-slot,rsi-zero-bar0,rdx-size-zero-defaults-4096"
output = "rax-existing-VA-or-u64::MAX"
validation = "requested-size-within-boot-probed-granted-extent"

[ipc.page_fault]
slot = 2
opcode = 259
legacy_opcode = 256
legacy_policy = "retired-codec-only-no-completion-authority"
transport = "register-only-by-value"
capability_kind = "Domain-async-enqueue-only"
target_policy = "nonzero-in-registry-and-distinct-from-caller"
type_id_reg = "rax"
caller_pd_reg = "rsi"
fault_addr_reg = "rdx"
error_code_reg = "r10"
token_reg = "r8"
address_bits = 48
address_policy = "nonzero-lower-canonical-user-data-nonpresent-only"

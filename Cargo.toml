[profile.release.package.craft-wordmodel]
opt-level = "s"
[profile.release.package.craft-xml]
opt-level = "s"
[profile.release.package.wordcraft-doc]
opt-level = "s"
[profile.release.package.wordcraft-docbin]
opt-level = "s"
[profile.release.package.wordcraft-docx]

license = "GPL-3.0-only"

[profile.release]
panic = "abort"

# Wasm guests and page scripts run on wasmi: build the interpreter for speed.
[profile.release.package.wasmi]
opt-level = 3
codegen-units = 1
[profile.release.package.wasmi_core]
opt-level = 3
codegen-units = 1
[profile.release.package.wasmi_ir]
opt-level = 3
codegen-units = 1
[profile.release.package.wasmi_collections]
opt-level = 3
codegen-units = 1
[profile.release.package.wasmparser]
opt-level = "z"
codegen-units = 1
[profile.release.package.sex-wasm]
opt-level = "z"
codegen-units = 1
[profile.release.package.wasm]
opt-level = "z"
codegen-units = 1
strip = true
# Spreadeagle carries GridCraft's whole engine: size-optimised and stripped, it stays well
# under the 32 MiB program limit.
[profile.release.package.spreadeagle]
strip = true
[profile.release.package."sha2@0.11.1"]
# SHA-256 at opt-level 3 compiles `rol $0xf` + `add %ebp,%edi`, which holds WRPKRU
# (0f 01 ef) and makes the loader refuse Spreadeagle (scripts/key_bytes.py). Only the
# version GridCraft uses; the build also relinks std programs in another layout.
opt-level = "s"
[profile.release.package.gridcraft-engine]
opt-level = "s"
[profile.release.package.gridcraft-functions]
opt-level = "s"
[profile.release.package.gridcraft-calc]
opt-level = "s"
[profile.release.package.gridcraft-xlsx]
opt-level = "s"
[profile.release.package.gridcraft-chart]
opt-level = "s"
[profile.release.package.gridcraft-pdf]
opt-level = "s"
[profile.release.package.gridcraft-formula]
opt-level = "s"
[profile.release.package.gridcraft-model]
opt-level = "s"
[profile.release.package.gridcraft-numfmt]
opt-level = "s"
[profile.release.package.gridcraft-math]
opt-level = "s"
[profile.release.package.gridcraft-core]
opt-level = "s"
# Assuit carries WordCraft's whole engine: size-optimised and stripped, it fits the
# 32 MiB program image (sex_pdx::program_store::IMAGE_BYTES).
[profile.release.package.assuit]
strip = true
[profile.release.package.craft-atomic]
opt-level = "s"
[profile.release.package.craft-cfb]
opt-level = "s"
[profile.release.package.craft-codepage]
opt-level = "s"

[profile.release.package.sex-html]
opt-level = 3
codegen-units = 1
[profile.release.package.sex-web]
opt-level = 3
codegen-units = 1

# Scripts run on wasmi; unoptimized it is too slow for the time budget even in tests.
# Without debug assertions, so its tail-call dispatch stays sibling calls (no stack growth).
[profile.dev.package.wasmi]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.wasmi_core]
opt-level = 3
[profile.dev.package.wasmi_ir]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
# naga's GLSL front end runs in programs: its preprocessor, made no_std (vendor/pp-rs-0.2.1).
[patch.crates-io]
pp-rs = { path = "vendor/pp-rs-0.2.1" }
# Bell captures sound: virtio-snd input transfers added (vendor/virtio-drivers-0.13.0/SEXOS_CHANGES.md).
virtio-drivers = { path = "vendor/virtio-drivers-0.13.0" }
# rg and fd: ignore's parallel walker on std's Hermit target (vendor/ignore-0.4.34/src/walk.rs, `SexOS:`).
ignore = { path = "vendor/ignore-0.4.34" }
# bat: console's stand-in terminal on std's Hermit target (vendor/console-0.16.6/src/lib.rs, `SexOS:`).
console = { path = "vendor/console-0.16.6" }
# bat: path_abs builds on std's Hermit target, without symbolic links (vendor/path_abs-0.5.1/src/dir.rs, `SexOS:`).
path_abs = { path = "vendor/path_abs-0.5.1" }
# bat: clircle builds on std's Hermit target, where it identifies no file (vendor/clircle-0.6.1/src/clircle_other.rs).
clircle = { path = "vendor/clircle-0.6.1" }
# The shader interpreter runs per vertex and per pixel; keep it fast in tests too.
# Assuit: filetime (via tar in craft-font-store) builds on std's Hermit target (vendor/filetime-0.2.29/src/hermit.rs).
filetime = { path = "vendor/filetime-0.2.29" }
# Assuit: tar (craft-font-store) treats std's Hermit target like wasm32: no unix paths, links or modes (vendor/tar-0.4.46).
tar = { path = "vendor/tar-0.4.46" }
# Assuit: WordCraft's PDF writer needs storytold's krilla fork, as WordCraft's own workspace patches it.
krilla = { git = "https://github.com/storytold/craft-libs", rev = "6e03f65bf45181db77ba6229716e6624db9eb25b" }

[profile.dev.package.sex-gl]
opt-level = 3
[profile.dev.package.naga]
opt-level = 2

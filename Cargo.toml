[workspace]
resolver = "2"
exclude = ["vendor/embedded-tls-0.19.0", "vendor/pp-rs-0.2.1"]
members = [
    "kernel",
    "servers/sexbell",
    "servers/sexdisplay",
    "servers/sexshop",
    "servers/silk-shell",
    "servers/sexinput",
    "servers/sexfiles",
    "servers/sexusb",
    "servers/silkbar",
    "servers/linen",
    "servers/quil",
    "servers/sexstore",
    "servers/sexnet",
    "servers/sext",
    "apps/sexdrive",
    "apps/kaleidoscope",
    "apps/hello",
    "apps/fortune",
    "apps/jot",
    "apps/files",
    "apps/peek",
    "apps/bench",
    "apps/view",
    "apps/wasm",
    "apps/heaptest",
    "apps/jit",
    "apps/threads",
    "apps/shapes",
    "apps/fputest",
    "apps/play",
    "apps/cpp",
    "apps/web",
    "crates/sex-app",
    "crates/sex-html",
    "crates/sex-js",
    "crates/sex-gl",
    "crates/sex-web",
    "apps/hum",
    "purple-scanout",
    "crates/sex-pdx",
    "crates/sex-font",
    "crates/sexfs",
    "crates/sex-volumes",
    "crates/sex-net",
    "crates/sex-net-config",
    "crates/sex-tls",
    "crates/sex-http",
    "crates/sex-fetch",
    "crates/sex-trust-config",
    "crates/sex-graphics",
    "crates/sex-canvas",
    "crates/sex-image",
    "crates/sex-libc",
    "crates/sex-media",
    "crates/silkbar-model",
    "crates/sex-object-model",
    "crates/sex-time",
    "crates/sex-wasm",
    "apps/spindle",
]
[workspace.package]
license = "GPL-3.0-only"

[profile.release]
panic = "abort"

# Wasm guests and page scripts run on wasmi: build the interpreter for speed.
[profile.release.package.wasmi]
opt-level = 3
codegen-units = 1
[profile.release.package.wasmi_core]
opt-level = 3
codegen-units = 1
[profile.release.package.wasmi_ir]
opt-level = 3
codegen-units = 1
[profile.release.package.wasmi_collections]
opt-level = 3
codegen-units = 1
[profile.release.package.wasmparser]
opt-level = "z"
codegen-units = 1
[profile.release.package.sex-wasm]
opt-level = "z"
codegen-units = 1
[profile.release.package.wasm]
opt-level = "z"
codegen-units = 1
strip = true
[profile.release.package.web]
opt-level = 3
codegen-units = 1
strip = true
[profile.release.package.sex-html]
opt-level = 3
codegen-units = 1
[profile.release.package.sex-web]
opt-level = 3
codegen-units = 1

# Scripts run on wasmi; unoptimized it is too slow for the time budget even in tests.
# Without debug assertions, so its tail-call dispatch stays sibling calls (no stack growth).
[profile.dev.package.wasmi]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.wasmi_core]
opt-level = 3
[profile.dev.package.wasmi_ir]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
# naga's GLSL front end runs in programs: its preprocessor, made no_std (vendor/pp-rs-0.2.1).
[patch.crates-io]
pp-rs = { path = "vendor/pp-rs-0.2.1" }
# The shader interpreter runs per vertex and per pixel; keep it fast in tests too.
[profile.dev.package.sex-gl]
opt-level = 3
[profile.dev.package.naga]
opt-level = 2
